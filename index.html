    el.style.transform = `rotate(${(i % 3 - 1) * 0.6}deg)`;
    const d = parse(it.createdAt);
    el.innerHTML = `${esc(it.text)}
      <div class="nmeta">
        <span class="ndot" style="background:${c ? c.color : '#E0D6C8'}"></span>
        <span class="num">${d ? `${d.getMonth()+1}/${d.getDate()} ${hhmm(d)}` : ''}</span>
        <span class="nsp"></span>
        <button class="nbtn pin ${it.pinned?'on':''}" title="${it.pinned?'取消钉住':'钉住'}">${it.pinned?'📌':'📍'}</button>
        <button class="nbtn del" title="删掉">✕</button>
      </div>`;
    el.querySelector('.pin').onclick = async () => {
      await call('/api/idea/update', { id: it.id, pinned: !it.pinned });
      await load();
    };
    el.querySelector('.del').onclick = async () => {
      await call('/api/idea/delete', { id: it.id });
      await load();
      toast('已删掉这条灵感');
    };
    list.appendChild(el);
  });

  input.addEventListener('input', () => { ideaDraft = input.value; });
  input.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const v = e.target.value.trim();
    if (!v) return;
    e.target.value = ''; ideaDraft = '';
    await call('/api/idea/add', { text: v });
    await load();
    const again = $('idea-input');
    if (again) again.focus();
  });
}

/* ================= 统计 ================= */
function openStats() {
  $('ov').classList.add('on');
  statsRange = 'today';
  $('ov-seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === 'today'));
  statsData = S.stats;
  renderStats();
  refreshStats();
}
const closeStats = () => $('ov').classList.remove('on');

async function refreshStats() {
  statsLoading = true; renderStats();
  const r = await call('/api/stats?range=' + statsRange + (S ? '&day=' + S.anchor : ''));
  if (r.ok) statsData = r;
  statsLoading = false; renderStats();
}

function renderStats() {
  const box = $('ov-body');
  if (statsLoading || !statsData) { box.innerHTML = '<div class="card">读取中…</div>'; return; }
  const d = statsData;
  box.innerHTML = [cardByCat(d), cardPlan(d), cardTrend(d), cardByTask(d)].join('');
}

function cardByCat(d) {
  const items = d.byCat.items;
  if (!items.length) {
    return `<div class="card"><h3>四类时长占比<span>${d.label}</span></h3>
      <div class="empty-note">这个时间段还没有排任何日程</div></div>`;
  }
  const stack = items.map(i => `<i style="width:${i.pct}%;background:${i.color}"></i>`).join('');
  const rows = items.map(i => `
    <div class="srow" title="${esc(i.detail.map(x => `${fmtDur(x.minutes)}  ${x.title}`).join('\n'))}">
      <span class="em">${i.emoji}</span>
      <span class="nm">${i.name}</span>
      <span class="fill"><i style="width:${i.pct}%;background:${i.color}"></i></span>
      <span class="pct num">${i.pct}%</span>
      <span class="tm num">${fmtDur(i.minutes)}</span>
    </div>`).join('');
  return `<div class="card">
    <h3>四类时长占比<span>${d.label} · 共 ${fmtDur(d.byCat.total)}</span></h3>
    <div class="stack">${stack}</div>${rows}
  </div>`;
}

function cardPlan(d) {
  const p = d.plan;
  const r = 34, c = 2 * Math.PI * r;
  const maxD = Math.max(...p.days.map(x => Math.max(x.planned, x.actual)), 60);
  const bars = p.days.map(x => {
    const hp = x.planned / maxD * 40;
    const ha = x.actual / maxD * 40;
    return `<div class="pday" title="${x.date}\n计划 ${fmtDur(x.planned)}\n实际 ${fmtDur(x.actual)}\n完成 ${fmtDur(x.done)}">
      <svg width="22" height="46" viewBox="0 0 22 46">
        <rect x="2" y="${44-hp}" width="8" height="${Math.max(hp,1)}" rx="3" fill="#F1E5D8"/>
        <rect x="12" y="${44-ha}" width="8" height="${Math.max(ha,1)}" rx="3" fill="#35C29A"/>
      </svg><span>${x.label.slice(1)}</span></div>`;
  }).join('');
  const gap = p.actual - p.planned;
  return `<div class="card">
    <h3>计划 vs 实际<span>${d.label}</span></h3>
    <div class="donutwrap">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="${r}" fill="none" stroke="#F4EDE4" stroke-width="11"/>
        ${p.rate > 0 ? `<circle cx="48" cy="48" r="${r}" fill="none" stroke="#E4573D" stroke-width="11"
          stroke-linecap="round" transform="rotate(-90 48 48)"
          stroke-dasharray="${c*p.rate/100} ${c}"/>` : ''}
        <text x="48" y="46" text-anchor="middle" font-size="19" font-weight="300" fill="#2E2A26">${p.rate}%</text>
        <text x="48" y="61" text-anchor="middle" font-size="9" fill="#A79E94">完成率</text>
      </svg>
      <div class="dl">
        <div class="dlrow"><span>计划</span><b class="num">${fmtDur(p.planned)}</b></div>
        <div class="dlrow"><span>实际做了</span><b class="num" style="color:#21896A">${fmtDur(p.actual)}</b></div>
        <div class="dlrow"><span>完成</span><b class="num">${fmtDur(p.done)}</b></div>
        <div class="dlrow"><span>${gap >= 0 ? '比计划多' : '比计划少'}</span>
          <b class="num" style="color:${gap >= 0 ? '#21896A' : '#C9503A'}">${fmtDur(Math.abs(gap))}</b></div>
      </div>
    </div>
    <div class="daybars">${bars}</div>
    <div class="legend">
      <span><i style="background:#F1E5D8"></i>计划</span>
      <span><i style="background:#35C29A"></i>实际</span>
      <span style="color:#B5AA9D">左边浅色是排了多久，右边绿色是真的做了多久</span>
    </div>
  </div>`;
}

function cardTrend(d) {
  const t = d.trend;
  const W = 540, H = 132, padL = 6, padB = 20;
  const max = Math.max(...t.map(x => x.total), 60);
  const n = t.length, gap = 10;
  const bw = (W - padL * 2 - gap * (n - 1)) / n;
  const cols = t.map((w, i) => {
    const x = padL + i * (bw + gap);
    let y = H - padB;
    const segs = ALL.filter(c => w.cats[c.key]).map(c => {
      const h = w.cats[c.key] / max * (H - padB - 14);
      y -= h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0.6)}" fill="${c.color}" rx="3"/>`;
    }).join('');
    return segs + `<text x="${x + bw/2}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#B5AA9D">${w.label}</text>`;
  }).join('');
  return `<div class="card">
    <h3>近 8 周趋势<span>按周三–周二 · 最高 ${fmtDur(max)}</span></h3>
    <svg class="chart" viewBox="0 0 ${W} ${H}">
      <line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" stroke="#F1E8DE" stroke-width="1"/>
      ${cols}
    </svg>
    <div class="legend">${ALL.filter(c => t.some(w => w.cats[c.key]))
      .map(c => `<span><i style="background:${c.color}"></i>${c.name}</span>`).join('')}</div>
  </div>`;
}

function cardByTask(d) {
  const list = d.byTask.slice(0, 8);
  if (!list.length) {
    return `<div class="card"><h3>每个任务累计<span>${d.label}</span></h3>
      <div class="empty-note">还没有可统计的日程</div></div>`;
  }
  const max = Math.max(...list.map(x => Math.max(x.minutes, x.actual || 0)));
  const rows = list.map(x => {
    const c = catOf(x.cat);
    const act = x.actual || 0;
    const gap = act - x.minutes;
    return `<div class="trow" title="${esc(x.title)}\n计划 ${fmtDur(x.minutes)} · 实际 ${fmtDur(act)}`
      + (act > 0 ? `（${gap >= 0 ? '多花' : '少花'} ${fmtDur(Math.abs(gap))}）` : '（还没计时）')
      + `\n出现 ${x.count} 次 · 共 ${x.days.length} 天\n${x.days.join('  ')}">
      <span class="em">${c.emoji}</span>
      <span class="nm">${esc(x.title)}</span>
      <span class="fill"><i style="width:${Math.max(x.minutes, act)/max*100}%;background:${c.color}"></i></span>
      <span class="tm num">${fmtDur(x.minutes)}</span>
      <span class="tm2 num">${act > 0 ? fmtDur(act) : '—'}</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <h3>每个任务：计划 / 实际<span>${d.label} · 最花时间的事</span></h3>
    <div class="trow head"><span class="em"></span><span class="nm"></span>
      <span class="fill"></span><span class="tm">计划</span><span class="tm2">实际</span></div>
    ${rows}
  </div>`;
}

/* ================= 添加 / 编辑 面板 ================= */
function openSheet(mode, task, presetCat, slot) {
  sheetCtx = { mode, task: task || null, cat: task ? normC(task.cat) : (presetCat || 'biz'), slot: slot || null };
  const t = task;
  const isTray = mode === 'tray';
  let minVal = isTray ? 60 : DEFAULT_MIN;
  if (t) minVal = (isTray ? t.minutes : t.estMin) || minVal;
  $('sheet-in').innerHTML = `
    <h4>${t ? '改这条' : isTray ? '加一个固定日程'
      : slot ? `在 ${hhmm(slot)} 加一件事` : '加一条待办'}</h4>
    <input class="sh-title" id="sh-title" placeholder="${isTray ? '比如：洗漱睡觉、复盘、会面' : '要做什么？'}"
           value="${t ? esc(t.title) : ''}" maxlength="120">
    <div class="catsel" id="sh-cats">
      ${CATS.map(c => `<button data-cat="${c.key}" class="${c.key===sheetCtx.cat?'on':''}"
          style="--c:${c.color};--s:${c.soft}"><span class="e">${c.emoji}</span>${c.name}</button>`).join('')}
    </div>
    <div class="footrow">
      <span class="flabel">${isTray ? '默认' : '预计'}</span>
      <div class="stepper">
        <button class="st" id="sh-minus" title="少 15 分钟">−</button>
        <input type="number" id="sh-min" min="15" step="15" value="${minVal}">
        <button class="st" id="sh-plus" title="多 15 分钟">＋</button>
        <span class="unit">分钟</span>
      </div>
      <button class="save" id="sh-save">${t ? '保存' : '加上'}</button>
    </div>`;
  $('sheet').classList.add('on');

  // 上下都以 15 分钟为单位
  const bump = d => {
    const el = $('sh-min');
    const cur = Math.round((Number(el.value) || 0) / 15) * 15;
    el.value = Math.max(15, cur + d);
  };
  $('sh-minus').onclick = () => bump(-15);
  $('sh-plus').onclick = () => bump(15);
  $('sh-min').addEventListener('change', () => {
    const el = $('sh-min');
    el.value = Math.max(15, Math.round((Number(el.value) || 0) / 15) * 15);
  });

  $('sh-cats').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      sheetCtx.cat = b.dataset.cat;
      $('sh-cats').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    };
  });
  $('sh-save').onclick = saveSheet;
  $('sh-title').addEventListener('keydown', e => { if (e.key === 'Enter') saveSheet(); });
  setTimeout(() => $('sh-title').focus(), 40);
}

async function saveSheet() {
  const title = $('sh-title').value.trim();
  if (!title) { $('sh-title').focus(); return; }
  const min = Number($('sh-min').value) || DEFAULT_MIN;
  const { mode, task, cat, slot } = sheetCtx;
  if (mode === 'tray') {
    if (task) await call('/api/tray/update', { id: task.id, title, cat, minutes: min });
    else await call('/api/tray/add', { title, cat, minutes: min });
  } else {
    let taskId = task ? task.id : null;
    if (task) await call('/api/task/update', { id: task.id, title, cat, estMin: min });
    else {
      const r = await call('/api/task/add', { title, cat, estMin: min });
      taskId = r.id || null;
    }
    // 从时间轴空白处双击进来的，顺手把日程也排上
    if (slot) {
      await call('/api/block/add', {
        title, cat, taskId,
        start: T(slot), minutes: min,
      });
    }
  }
  closeSheet();
  await load();
  toast(task ? '已保存' : slot ? '已排进今天' : '加上了');
}

function closeSheet() { $('sheet').classList.remove('on'); sheetCtx = null; }
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

/* ================= 撤销 / 提示 ================= */
function toast(msg, undoable = true) {
  $('toast-msg').textContent = msg;
  $('toast-undo').style.display = undoable ? '' : 'none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), 7000);
}
async function doUndo() {
  const r = await call('/api/undo', {});
  if (!r.ok) { toast(r.error || '没东西可撤销', false); return; }
  $('toast').classList.remove('on');
  statsData = null;
  await load();
  toast(`已撤销：${r.label}`, false);
}
$('toast-undo').onclick = doUndo;

/* ================= 交互绑定 ================= */
$('side-tabs').querySelectorAll('.stab').forEach(b => b.addEventListener('click', () => {
  $('side-tabs').querySelectorAll('.stab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  pane = b.dataset.pane;
  renderSide();
}));

$('add-btn').onclick = () => openSheet('task');
$('stats-btn').onclick = openStats;
$('ov-back').onclick = closeStats;

/* ---- 翻日子：昨天 / 明天 ---- */
async function gotoDay(day) {
  viewDay = day;                 // null = 今天
  statsData = null;
  closePop(); closeSheet();
  await load();
}
$('day-prev').onclick = () => { if (S) gotoDay(S.prevDay); };
$('day-next').onclick = () => { if (S) gotoDay(S.nextDay); };
$('day-today').onclick = () => gotoDay(null);

/* ---- 改「到几点干不干得完」的截止时间 ---- */
let cutDraft = [18, 24];
const fmtHour = h => (Number(h) >= 24 || Number(h) === 0) ? '24:00' : `${p2(Number(h))}:00`;
const paintCuts = () => {
  $('cut-day').textContent = fmtHour(cutDraft[0]);
  $('cut-night').textContent = fmtHour(cutDraft[1]);
};
function openCuts() {
  const src = (S.cutHours && S.cutHours.length) ? S.cutHours : [18, 24];
  cutDraft = [Number(src[0] != null ? src[0] : 18), Number(src[1] != null ? src[1] : 24)];
  paintCuts();
  $('cut-sheet').classList.add('on');
}
const closeCuts = () => $('cut-sheet').classList.remove('on');
$('fit').onclick = openCuts;
$('cut-sheet').addEventListener('click', e => { if (e.target === $('cut-sheet')) closeCuts(); });
$('cut-sheet').querySelectorAll('[data-cut]').forEach(b => {
  b.onclick = () => {
    const [which, d] = b.dataset.cut.split(':');
    const i = which === 'd' ? 0 : 1;
    cutDraft[i] = Math.max(0, Math.min(24, (cutDraft[i] || 0) + Number(d)));
    paintCuts();
  };
});
$('cut-reset').onclick = () => { cutDraft = [18, 24]; paintCuts(); };
$('cut-save').onclick = async () => {
  await call('/api/meta/cuts', { cutHours: cutDraft });
  closeCuts();
  await load();
  toast('截止时间改好了');
};

/* ---- 番茄钟：别人的现成页面，塞在 iframe 里 ---- */
function openPomo() {
  const f = $('pomo-frame');
  const src = f.getAttribute('src');
  if (!src || src === 'about:blank') f.src = '/pomodoro/';
  $('pomo').classList.add('on');
}
const closePomo = () => $('pomo').classList.remove('on');
$('pomo-btn').onclick = openPomo;
$('pomo-back').onclick = closePomo;
$('ov-seg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  $('ov-seg').querySelectorAll('button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  statsRange = b.dataset.r;
  refreshStats();
}));

$('refresh').addEventListener('click', async e => {
  e.currentTarget.classList.add('spin');
  statsData = null;
  await load();
  setTimeout(() => e.currentTarget.classList.remove('spin'), 400);
});

// 双击时间轴空白处 = 在那一刻加一件事并排上
$('tl-scroll').addEventListener('dblclick', e => {
  if (e.target.closest('.ev')) return;
  if (!$('tl').contains(e.target)) return;
  openSheet('task', null, 'biz', timeFromY(e.clientY));
});

// 每秒走一次：时钟、倒计时数字、到点自动弹出、干不干得完那条
let lastFitMin = -1;
function heart() {
  const now = new Date();
  $('clock').textContent = hhmm(now);
  if (!S) return;
  autoMaybe(now);
  paintTimer(now);
  if (now.getMinutes() !== lastFitMin) {
    lastFitMin = now.getMinutes();
    renderFit(now);
    renderBar();
  }
}
heart();
setInterval(heart, 1000);
setInterval(() => load(), 120000);
window.addEventListener('focus', () => load());
window.addEventListener('resize', () => { if (S) { layout(); renderTimeline(); } });

bindDropZone();
load();

</script>
<script>
/* ==========================================================================
   手机版的额外交互 —— 由 tools/build-mobile.js 追加在主脚本之后。
   主脚本里的 load / S / toast / call 等都是顶层声明，这里可以直接用。
   ========================================================================== */
(function () {
  const $ = id => document.getElementById(id);

  /* ================= 1. 底部面板：点标签展开 / 再点收起 ================= */
  // 初始状态在 mobile-api.js 里就定好了（要赶在时间轴算高度之前）
  const SIDE_KEY = 'desk.sideOpen';

  let wasSameTab = false;
  $('side-tabs').addEventListener('pointerdown', e => {
    const b = e.target.closest('.stab');
    wasSameTab = !!b && pane === b.dataset.pane;
  }, true);

  $('side-tabs').querySelectorAll('.stab').forEach(b => {
    b.addEventListener('click', () => {
      const open = document.body.classList.contains('side-open');
      const next = !(wasSameTab && open);
      document.body.classList.toggle('side-open', next);
      try { localStorage.setItem(SIDE_KEY, next ? '1' : '0'); } catch { }
      // 面板高度变了，时间轴要重算每小时的像素
      setTimeout(() => { if (S) { layout(); renderTimeline(); } }, 260);
    });
  });

  /* ================= 2. 点一下就排进去（手机上拖拽用不了） ================= */
  const DAY_NAMES = ['今天', '明天', '后天'];
  let schedItem = null, schedDay = 0;

  function ensureSheet() {
    if ($('sched-sheet')) return;
    const box = document.createElement('div');
    box.className = 'sheet';
    box.id = 'sched-sheet';
    box.innerHTML = `
      <div class="sheet-in">
        <h4 id="sched-title">排到什么时候</h4>
        <div class="sched-days" id="sched-days"></div>
        <div class="sched-times" id="sched-times"></div>
        <div class="footrow">
          <button class="ghost" id="sched-now">现在就做</button>
          <button class="save" id="sched-cancel">取消</button>
        </div>
      </div>`;
    document.querySelector('.app').appendChild(box);

    box.addEventListener('click', e => { if (e.target === box) closeSched(); });
    $('sched-days').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      schedDay = Number(b.dataset.d);
      paintSched();
    });
    $('sched-times').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      placeAt(Number(b.dataset.min));
    });
    $('sched-cancel').onclick = closeSched;
    $('sched-now').onclick = async () => {
      const it = schedItem;
      closeSched();
      if (!it) return;
      if (it.kind === 'task') {
        await startTimer({ taskId: it.id });
      } else {
        const r = await call('/api/block/add', {
          title: it.title, cat: it.cat, start: T(new Date()), minutes: it.minutes || DEFAULT_MIN,
        });
        if (r.ok) await startTimer({ blockId: r.id });
      }
    };
  }

  const closeSched = () => { const el = $('sched-sheet'); if (el) el.classList.remove('on'); };

  /** 那一天的 09:00 往后推 min 分钟 */
  function slotAt(dayKeyStr, min) {
    return new Date(parse(dayKeyStr + 'T09:00').getTime() + min * 60000);
  }
  function dayKeyOf(offset) {
    const base = parse(S.todayKey + 'T12:00');
    base.setDate(base.getDate() + offset);
    return T(base).slice(0, 10);
  }

  function paintSched() {
    if (!schedItem || !S) return;
    $('sched-title').textContent = `把「${schedItem.title}」排到`;
    $('sched-days').innerHTML = DAY_NAMES.map((n, i) => {
      const dk = dayKeyOf(i);
      const d = parse(dk + 'T12:00');
      return `<button data-d="${i}" class="${i === schedDay ? 'on' : ''}">${n}<br>
        <span style="font-size:10px">${d.getMonth() + 1}/${d.getDate()}</span></button>`;
    }).join('');

    const dk = dayKeyOf(schedDay);
    const now = new Date();
    const busy = new Set(S.events.map(e => String(e.start).slice(0, 10) === dk ? e.start : null).filter(Boolean));
    const slots = [];
    for (let m = 0; m <= 17 * 60 - 30; m += 30) {
      const d = slotAt(dk, m);
      const key = T(d);
      slots.push(`<button data-min="${m}" class="${busy.has(key) ? 'busy' : ''}${d < now ? ' past' : ''}">
        ${hhmm(d)}</button>`);
    }
    $('sched-times').innerHTML = slots.join('');
  }

  async function placeAt(min) {
    const it = schedItem;
    if (!it) return;
    const dk = dayKeyOf(schedDay);
    const d = slotAt(dk, min);
    closeSched();
    await call('/api/block/add', {
      title: it.title, cat: it.cat,
      taskId: it.kind === 'task' ? it.id : null,
      start: T(d), minutes: it.estMin || it.minutes || DEFAULT_MIN,
    });
    await load();
    toast(`已排到 ${schedDay === 0 ? '今天' : DAY_NAMES[schedDay]} ${hhmm(d)}`);
  }

  window.MOBILE_SCHEDULE = function (item) {
    schedItem = item;
    schedDay = 0;
    ensureSheet();
    paintSched();
    $('sched-sheet').classList.add('on');
    $('sched-times').scrollTop = 0;
  };

  /* ================= 3. 备份：挂在统计页最下面 ================= */
  const origRenderStats = renderStats;
  renderStats = function () {
    origRenderStats();
    const box = $('ov-body');
    if (!box || box.querySelector('.backup-card')) return;
    box.insertAdjacentHTML('beforeend', `
      <div class="card backup-card">
        <h3>备份<span>数据只在这台手机里</span></h3>
        <div class="empty-note" style="padding:4px 0 10px;text-align:left">
          换手机、或者清了浏览器数据就没了。隔段时间导出一次，把文件存到网盘或发给自己。
        </div>
        <div class="backup-row">
          <button id="bk-out">导出备份</button>
          <button id="bk-in">导入备份</button>
        </div>
        <div class="backup-row">
          <button id="bk-wipe" style="color:#B4462C">清空重来</button>
        </div>
      </div>`);
    bindBackup();
  };

  function bindBackup() {
    const out = $('bk-out'), inn = $('bk-in'), wipe = $('bk-wipe');
    if (!out) return;
    out.onclick = () => {
      const name = `日程备份-${dayKeyNow()}.json`;
      const blob = new Blob([window.DESK_DB.dump()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('备份已导出，去「下载」里找');
    };
    inn.onclick = () => {
      const f = document.createElement('input');
      f.type = 'file';
      f.accept = '.json,application/json';
      f.onchange = () => {
        const file = f.files && f.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = async () => {
          try {
            window.DESK_DB.load(String(r.result));
            statsData = null;
            await load();
            toast('导入好了，当前数据已换成备份里的');
          } catch (e) {
            showErr('这个文件读不了：' + e.message);
          }
        };
        r.readAsText(file);
      };
      f.click();
    };
    wipe.onclick = async () => {
      if (!confirm('真的清空吗？清掉就没了，除非你导出过备份。')) return;
      window.DESK_DB.wipe();
      statsData = null;
      await load();
      toast('已经清空了');
    };
  }

  /* ================= 4. 番茄钟：同一份别人的代码，放隔壁页面里 ================= */
  $('pomo-btn').onclick = () => {
    const f = $('pomo-frame');
    const src = f.getAttribute('src');
    if (!src || src === 'about:blank') f.src = 'pomodoro.html';
    $('pomo').classList.add('on');
  };

  /* ================= 5. 离线缓存（只在 https 或 localhost 下有效） ================= */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    });
  }
})();

</script>
