<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFAF5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日程</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

  :root{
    --bg:#FFFAF5; --card:#FFFFFF;
    --ink:#2E2A26; --ink2:#6B635B; --ink3:#A79E94;
    --line:#F1E8DE; --line2:#E4D9CC;
    --now:#E4573D;
    --shadow:0 2px 8px rgba(130,96,64,.07);
    --shadow-lg:0 10px 28px rgba(130,96,64,.18);
    --bounce:cubic-bezier(.34,1.45,.64,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 80% at 15% -10%, #FFF4E9 0%, var(--bg) 48%);
    color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overflow:hidden; user-select:none;
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
  button{font-family:inherit;}
  .app{height:100%; display:flex; flex-direction:column; position:relative;}

  /* ================= 顶栏 ================= */
  .topbar{display:flex; align-items:center; gap:12px; padding:12px 18px 0; flex:none;}
  .topbar .grow{flex:1;}
  .daynav{display:flex; align-items:center; gap:3px; min-width:0;}
  .dnav{
    border:0; background:transparent; color:var(--ink3); cursor:pointer;
    font-size:17px; line-height:1; padding:1px 5px 3px; border-radius:8px;
    transition:background .15s, color .15s;
  }
  .dnav:hover{background:#F5EDE3; color:var(--ink);}
  .today-btn{
    border:1px solid var(--line2); background:#fff; color:var(--ink2); cursor:pointer;
    font-size:10.5px; padding:2px 8px; border-radius:8px; margin-left:3px; flex:none;
    transition:background .15s, color .15s, transform .15s var(--bounce);
  }
  .today-btn:hover{background:#F8F1E8; color:var(--ink); transform:translateY(-1px);}
  .today-btn[hidden]{display:none;}
  .date{font-size:16px; font-weight:700; white-space:nowrap;}
  .date em{font-style:normal; color:var(--ink3); font-weight:400; font-size:12.5px; margin-left:6px;}
  .date em.today{color:var(--now); font-weight:600;}
  .ring{position:relative; width:34px; height:34px; flex:none; cursor:help;}
  .ring svg{transform:rotate(-90deg);}
  .ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          font-size:9.5px; font-weight:700; color:var(--ink2);}
  .clock{font-size:24px; font-weight:300; line-height:1; letter-spacing:.02em;}
  .ibtn{
    border:0; background:transparent; color:var(--ink3); cursor:pointer;
    font-size:16px; line-height:1; padding:6px; border-radius:9px;
    transition:background .15s, color .15s, transform .15s var(--bounce);
  }
  .ibtn:hover{color:var(--ink); background:#F5EDE3; transform:translateY(-1px);}
  .ibtn.plus{font-size:20px;}
  .ibtn.spin{animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* ================= 现在条 ================= */
  .next{
    margin:10px 18px 0; padding:8px 12px; border-radius:12px; flex:none;
    background:#FFF1E8; color:#9C4A2E; font-size:12.5px;
    display:flex; align-items:center; gap:8px; min-height:36px;
  }
  .next b{font-weight:700;}
  .next .dot{width:7px; height:7px; border-radius:50%; background:#E4573D; flex:none;
             animation:pulse 2.2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(228,87,61,.45);}
    70%{box-shadow:0 0 0 7px rgba(228,87,61,0);}
    100%{box-shadow:0 0 0 0 rgba(228,87,61,0);}
  }
  .next.idle{background:#F7F2EB; color:var(--ink3);}
  .next.idle .dot{background:#D8CCBC; animation:none; box-shadow:none;}

  /* ================= 今天干不干得完 ================= */
  .fit{margin:8px 18px 0; flex:none; padding:7px 12px 8px; border-radius:12px;
       background:#F7F3EC; color:var(--ink2); font-size:11.5px; cursor:pointer;
       transition:background .15s;}
  .fit:hover{background:#F1EBE1;}
  .fit .fit-top{display:flex; align-items:baseline; gap:8px;}
  .fit .fit-top span:first-child{flex:1; min-width:0;}
  .fit .fit-top span:last-child{flex:none; color:var(--ink3);}
  .fit b{font-weight:700; color:var(--ink);}
  .fit .fit-bar{height:4px; border-radius:2px; background:#E9E0D3; overflow:hidden; margin-top:6px;}
  .fit .fit-bar i{display:block; height:100%; border-radius:2px; background:#35C29A;
                  transition:width .4s ease, background .3s;}
  .fit.over{background:#FDEDE8; color:#9C4A2E;}
  .fit.over b{color:#A63D22;}
  .fit.over .fit-top span:last-child{color:#B4462C; font-weight:600;}
  .fit.over .fit-bar i{background:#E4573D;}
  .fit.tight{background:#FFF6E8; color:#8A6A32;}
  .fit.tight .fit-bar i{background:#E8A33D;}

  /* ================= 倒计时 ================= */
  .timer{
    margin:10px 18px 0; flex:none; display:none; position:relative; overflow:hidden;
    border-radius:14px; padding:10px 14px 11px 16px;
    background:linear-gradient(135deg,#FFF8F2 0%,#FFFFFF 70%);
    border:1px solid #F3DCCB; box-shadow:0 6px 18px rgba(190,110,60,.13);
  }
  .timer.on{display:block; animation:dropin .28s var(--bounce);}
  @keyframes dropin{
    from{opacity:0; transform:translateY(-12px) scale(.98);}
    to{opacity:1; transform:none;}
  }
  .timer::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,#E4573D);}
  .timer.over{border-color:#F0C0AF; background:linear-gradient(135deg,#FDEEE9 0%,#FFFFFF 70%);}
  .timer.over::before{background:#C22F1E;}
  .tm-top{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink2);}
  .tm-top .tm-em{font-size:12px; flex:none;}
  .tm-top .tm-name{flex:1; min-width:0; font-weight:600; color:var(--ink);
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tm-top .tm-x{border:0; background:transparent; color:#C9BCAC; cursor:pointer;
                font-size:12px; line-height:1; padding:2px 2px;}
  .tm-top .tm-x:hover{color:var(--ink2);}
  .tm-row{display:flex; align-items:flex-end; gap:10px; margin-top:1px;}
  .tm-big{font-size:34px; font-weight:200; line-height:1.14; letter-spacing:.01em; color:#2E2A26;}
  .tm-big small{font-size:12px; font-weight:400; color:var(--ink3); margin-left:4px;}
  .timer.low .tm-big{color:#C9503A;}
  .timer.over .tm-big{color:#C22F1E;}
  .tm-side{margin-left:auto; text-align:right; font-size:10px; color:var(--ink3); line-height:1.6;}
  .tm-bar{height:5px; border-radius:3px; background:#F2E5DA; overflow:hidden; margin-top:6px;}
  .tm-bar i{display:block; height:100%; border-radius:3px; background:var(--c,#E4573D);
            transition:width .9s linear;}
  .timer.over .tm-bar i{background:#C22F1E;}
  .tm-btns{display:flex; gap:5px; margin-top:9px;}
  .tm-btns button{
    flex:1; border:1px solid var(--line2); background:#fff; border-radius:8px;
    padding:5px 0; font-size:11.5px; color:var(--ink2); cursor:pointer;
    transition:background .15s, border-color .15s, transform .15s var(--bounce);
  }
  .tm-btns button:hover{background:#F8F1E8; border-color:#D6C6B2; transform:translateY(-1px);}
  .tm-btns button.done{background:#EEFAF5; border-color:#CDEBDF; color:#21896A; font-weight:600;}
  .tm-btns button.done:hover{background:#E2F7EF;}

  .err{margin:8px 18px 0; padding:8px 12px; border-radius:10px; flex:none;
       background:#FDEDE8; color:#A63D22; font-size:12px; display:none;}
  .err.on{display:block;}

  /* ================= 主区 ================= */
  .main{flex:1; min-height:0; display:flex; padding-top:10px;}

  /* ---- 时间轴 ---- */
  .tl-scroll{flex:1; min-width:0; overflow-y:auto; overflow-x:hidden;
             padding:0 10px 14px 14px; position:relative;}
  .tl-scroll.dragover{background:rgba(47,107,94,.04); border-radius:14px;}
  .tl-scroll::-webkit-scrollbar,.side-body::-webkit-scrollbar,
  .ov-body::-webkit-scrollbar{width:7px;}
  .tl-scroll::-webkit-scrollbar-thumb,.side-body::-webkit-scrollbar-thumb,
  .ov-body::-webkit-scrollbar-thumb{background:#E3D8C9; border-radius:4px;}
  .tl-scroll::-webkit-scrollbar-track,.side-body::-webkit-scrollbar-track,
  .ov-body::-webkit-scrollbar-track{background:transparent;}

  .tl{position:relative;}
  .hour{position:absolute; left:44px; right:0; border-top:1px dashed var(--line); pointer-events:none;}
  .hour i{position:absolute; left:-44px; top:-8px; width:38px; text-align:right;
          font-style:normal; font-size:10.5px; color:var(--ink3);}
  .hour.first{border-top:0;}
  .hour.first i{top:0;}

  .ev{
    position:absolute; border-radius:10px; padding:3px 9px 3px 10px; overflow:hidden;
    background:var(--s,#F4EFE9); border-left:3px solid var(--c,#B8B1A9);
    cursor:grab; touch-action:none;
    box-shadow:0 1px 3px rgba(130,96,64,.08);
    transition:box-shadow .18s, transform .18s var(--bounce);
  }
  .ev:hover{box-shadow:0 4px 12px rgba(130,96,64,.16); transform:translateY(-1px);}
  .ev .ev-emoji{position:absolute; right:6px; top:3px; font-size:10px; opacity:.75;}
  .ev .ev-n{
    font-size:12px; line-height:1.26; font-weight:500; color:#3A342E;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    padding-right:14px;
  }
  .ev .ev-t{font-size:10px; line-height:1.1; color:rgba(70,60,50,.55); margin-top:1px;}
  .ev .rz{position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize;}
  .ev .rz::after{
    content:""; position:absolute; left:50%; bottom:3px; width:22px; height:2px;
    border-radius:2px; background:rgba(0,0,0,.15); transform:translateX(-50%);
    opacity:0; transition:opacity .15s;
  }
  .ev:hover .rz::after{opacity:1;}
  .ev.past{opacity:.5;}
  .ev.done{opacity:.55;}
  .ev.done .ev-n{text-decoration:line-through; color:#8B8479;}
  .ev.running{box-shadow:0 0 0 1.5px var(--c), 0 3px 12px rgba(130,96,64,.18);}
  .ev.running .ev-t{color:#9C4A2E; font-weight:600;}
  .ev.mini{padding-top:1px; padding-bottom:1px;}
  .ev.mini .ev-n{display:block; white-space:nowrap; text-overflow:ellipsis;
                 font-size:11px; -webkit-line-clamp:unset; margin-top:1px;}
  .ev.mini .ev-t,.ev.mini .ev-emoji{display:none;}
  .ev.moving{opacity:.9; z-index:9; box-shadow:0 10px 24px rgba(60,40,20,.24);
             cursor:grabbing; transform:rotate(-1deg) scale(1.02);}
  .ev.resizing{opacity:.9; z-index:9; cursor:ns-resize;}

  .nowline{position:absolute; left:44px; right:0; border-top:1.5px solid var(--now);
           z-index:3; pointer-events:none;}
  .nowline b{position:absolute; left:-44px; top:-8px; width:38px; text-align:center;
             background:var(--now); color:#fff; font-size:9.5px; font-weight:600;
             padding:1px 0; border-radius:8px;}
  .nowline i{position:absolute; left:-4px; top:-3.5px; width:7px; height:7px; border-radius:50%;
             background:var(--now); animation:pulse 2.2s infinite;}

  .dropline{
    position:absolute; left:44px; right:0; height:34px; border-radius:9px; display:none;
    border:1.5px dashed #9DBDB2; background:rgba(47,107,94,.08);
    align-items:center; justify-content:center; font-size:11.5px; color:#2F6B5E;
    z-index:6; pointer-events:none;
  }
  .dropline.on{display:flex;}

  .empty{position:absolute; left:0; right:0; top:0; bottom:0;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:8px; pointer-events:none;}
  .empty p{font-size:12.5px; color:var(--ink3);}
  .empty .hint{font-size:11px; color:#C8BCAC;}

  /* ---- 右侧面板 ---- */
  .side{
    width:264px; flex:none; display:flex; flex-direction:column; min-height:0;
    border-left:1px solid var(--line); background:rgba(255,255,255,.55);
  }
  .side-tabs{display:flex; gap:2px; padding:8px 10px 6px; flex:none;}
  .stab{
    flex:1; border:0; background:transparent; cursor:pointer; padding:5px 4px; border-radius:9px;
    font-size:12px; color:var(--ink2); transition:background .15s,color .15s;
  }
  .stab:hover{background:#F6EEE4;}
  .stab.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:var(--shadow);}
  .stab i{font-style:normal; color:var(--ink3); font-size:10.5px; margin-left:3px;}
  .stab.on i{color:var(--now);}
  .side-body{flex:1; min-height:0; overflow-y:auto; padding:2px 10px 12px;}

  .grp{margin-top:10px;}
  .grp-h{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
         color:var(--ink2); padding:0 2px 5px;}
  .grp-h .gname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .grp-h .gcount{font-weight:400; color:var(--ink3); font-size:10.5px;}
  .grp-h .gadd{
    border:0; background:transparent; color:var(--ink3); cursor:pointer; font-size:14px;
    line-height:1; padding:0 3px; border-radius:5px; opacity:0;
    transition:opacity .15s, background .15s, color .15s;
  }
  .grp:hover .gadd{opacity:1;}
  .grp-h .gadd:hover{color:var(--ink); background:#F3EADF;}

  .row{
    display:flex; align-items:center; gap:7px; padding:6px 7px; border-radius:10px;
    cursor:grab; margin-bottom:3px; background:#fff; box-shadow:var(--shadow);
    border:1px solid transparent;
    transition:transform .15s var(--bounce), box-shadow .15s, opacity .15s;
  }
  .row:hover{transform:translateY(-1px); box-shadow:0 5px 14px rgba(130,96,64,.13);}
  .row:active{cursor:grabbing;}
  .row.dragging{opacity:.35;}
  .row .grip{color:#D5C9B9; font-size:11px; flex:none;}
  .row .bar{width:3px; height:15px; border-radius:2px; flex:none; background:var(--c);}
  .row .txt{flex:1; min-width:0; font-size:12.5px; line-height:1.35; cursor:text;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .est{font-size:10.5px; color:var(--ink3); flex:none;}
  .row .done-min{font-size:9.5px; color:#3AA184; flex:none;}
  .row .play{
    border:0; background:transparent; color:#C9BCAC; cursor:pointer; font-size:10px;
    line-height:1; padding:1px 2px; flex:none; opacity:0;
    transition:opacity .15s, color .15s, transform .15s var(--bounce);
  }
  .row:hover .play{opacity:1;}
  .row .play:hover{color:#21896A; transform:scale(1.3);}
  .row .sched{display:none;}
  .chip .sched{display:none;}
  .row.running{box-shadow:0 0 0 1.5px var(--c) inset, var(--shadow);}
  .row.running .play{opacity:1; color:#E4573D;}
  .row .chk{
    width:15px; height:15px; flex:none; border-radius:5px; border:1.5px solid #D5C9B9;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s, transform .15s var(--bounce);
  }
  .row .chk:hover{border-color:#35C29A; background:#E9F9F3; transform:scale(1.12);}
  .row.done .txt{text-decoration:line-through; color:#B7AFA4;}
  .row.done .chk{background:#35C29A; border-color:#35C29A;}
  .row.done .chk::after{content:"✓"; color:#fff; font-size:10px; font-weight:700; line-height:1;}
  .row .del{
    border:0; background:transparent; color:#D8CCBC; cursor:pointer; font-size:13px;
    line-height:1; padding:0 2px; flex:none; opacity:0;
    transition:opacity .15s, color .15s;
  }
  .row:hover .del{opacity:1;}
  .row .del:hover{color:#C9503A;}
  .row.drop-target{box-shadow:0 -2px 0 0 #35C29A inset, var(--shadow);}

  .chips{display:flex; flex-wrap:wrap; gap:6px; padding-top:2px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; cursor:grab;
    background:#fff; border-radius:9px; padding:5px 9px; font-size:12px; max-width:100%;
    box-shadow:var(--shadow);
    transition:transform .15s var(--bounce), box-shadow .15s, opacity .15s;
  }
  .chip:hover{transform:translateY(-1px); box-shadow:0 5px 14px rgba(130,96,64,.13);}
  .chip:active{cursor:grabbing;}
  .chip.dragging{opacity:.35;}
  .chip .bar{width:3px; height:13px; border-radius:2px; flex:none; background:var(--c);}
  .chip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:148px; cursor:text;}
  .chip .mm{font-size:10px; color:var(--ink3); flex:none;}
  .chip.on-day{opacity:.5;}
  .chip .x{
    border:0; background:transparent; color:#D8CCBC; cursor:pointer; font-size:12px;
    line-height:1; padding:0; opacity:0; transition:opacity .15s, color .15s;
  }
  .chip:hover .x{opacity:1;}
  .chip .x:hover{color:#C9503A;}

  .addrow{
    display:flex; align-items:center; gap:6px; margin-top:8px;
    padding:6px 9px; border-radius:9px; border:1px dashed var(--line2);
    font-size:12px; color:var(--ink3); cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .addrow:hover{border-color:#C4B5A2; color:var(--ink2); background:#FFFDFB;}

  /* ---- 灵感 ---- */
  .idea-in{display:flex; gap:6px; padding:4px 0 10px; position:sticky; top:0;
           background:linear-gradient(#FFFDFB 70%, rgba(255,253,251,0)); z-index:2;}
  .idea-in input{
    flex:1; min-width:0; font:inherit; font-size:12.5px; padding:8px 11px; border-radius:10px;
    border:1px solid var(--line2); background:#fff; outline:none; color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  .idea-in input:focus{border-color:#F0C9A8; box-shadow:0 0 0 3px rgba(255,138,91,.12);}
  .idea-in input::placeholder{color:#C4B8A8;}
  .note{
    background:#fff; border-radius:11px; padding:9px 11px; margin-bottom:8px;
    box-shadow:var(--shadow); font-size:12.5px; line-height:1.55; color:#3D372F;
    word-break:break-word;
    transition:transform .2s var(--bounce), box-shadow .2s;
  }
  .note:hover{box-shadow:0 8px 20px rgba(130,96,64,.15);}
  .note .nmeta{display:flex; align-items:center; gap:6px; margin-top:6px;
               font-size:10px; color:var(--ink3);}
  .note .ndot{width:6px; height:6px; border-radius:50%; flex:none;}
  .note .nsp{flex:1;}
  .note .nbtn{border:0; background:transparent; cursor:pointer; color:#D0C3B3;
              font-size:11px; padding:0 2px; opacity:0;
              transition:opacity .15s, color .15s;}
  .note:hover .nbtn{opacity:1;}
  .note .nbtn:hover{color:var(--ink2);}
  .note .nbtn.on{opacity:1;}
  .note.pinned{background:#FFFBEE;}

  .empty-note{font-size:12px; color:var(--ink3); padding:18px 6px; text-align:center; line-height:1.7;}

  /* ================= 统计整页 ================= */
  .ov{
    position:absolute; inset:0; z-index:30; display:none; flex-direction:column;
    background:radial-gradient(120% 80% at 15% -10%, #FFF4E9 0%, var(--bg) 48%);
  }
  .ov.on{display:flex; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .ov-head{display:flex; align-items:center; gap:10px; padding:12px 18px 8px; flex:none;}
  .ov-head .back{
    border:0; background:#fff; color:var(--ink2); cursor:pointer; font-size:12.5px;
    padding:6px 12px; border-radius:10px; box-shadow:var(--shadow);
    transition:transform .15s var(--bounce), box-shadow .15s;
  }
  .ov-head .back:hover{transform:translateX(-2px); box-shadow:0 5px 14px rgba(130,96,64,.13);}
  .seg{display:flex; gap:3px; background:#F2EADE; border-radius:11px; padding:3px; margin-left:auto;}
  .seg button{
    border:0; background:transparent; cursor:pointer; font-size:11.5px; padding:4px 12px;
    border-radius:8px; color:var(--ink2); transition:background .15s, color .15s;
  }
  .seg button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:var(--shadow);}
  .ov-body{flex:1; min-height:0; overflow-y:auto; padding:4px 18px 22px;
           display:flex; flex-direction:column; gap:12px;}
  .pomo-tip{margin-left:auto; font-size:11px; color:var(--ink3);}
  #pomo iframe{flex:1; min-height:0; width:100%; border:0; background:#2b2d33;}

  .card{background:#fff; border-radius:16px; padding:14px 16px; box-shadow:var(--shadow);
        animation:fade .25s ease;}

function anchorOf(now) {
  const d = new Date(now);
  if (d.getHours() < DAY_END_HOUR) d.setDate(d.getDate() - 1);
  return d;
}

/**
 * 一天的边界。dayStr 传 'YYYY-MM-DD' 就看那一天，不传就是今天。
 * 今天这个情况要按「凌晨 02:00 前算前一天」来定锚点。
 */
function frame(now = new Date(), dayStr = null) {
  let anchor = dayStr ? parseT(dayStr) : null;
  if (!anchor) anchor = anchorOf(now);
  return {
    anchor,
    dayStart: atHour(anchor, DAY_START_HOUR),
    dayEnd: atHour(addDays(anchor, 1), DAY_END_HOUR),
  };
}

const isDayStr = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

/** 她的"一周"是周三 ~ 周二 */
function weekStart(d) {
  const x = atHour(d, 0);
  x.setDate(x.getDate() - ((x.getDay() - 3 + 7) % 7));
  return atHour(x, DAY_START_HOUR);
}

/* ---------------- 校验 ---------------- */
const bad = msg => Object.assign(new Error(msg), { status: 400 });

function mustText(v, name = '内容') {
  const s = String(v == null ? '' : v).trim();
  if (!s) throw bad(`缺少${name}`);
  return s.slice(0, 200);
}
function mustId(v) {
  const s = String(v == null ? '' : v);
  if (!s) throw bad('缺少 id');
  return s;
}
function mustTime(v, name) {
  const d = parseT(v);
  if (!d) throw bad(`${name}看不懂：${v}`);
  return T(d);
}
function optInt(v, def) {
  if (v === '' || v == null) return def;
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? n : def;
}

/* ---------------- 查询 ---------------- */
const blocksIn = (db, from, to) => db.blocks
  .filter(b => { const s = parseT(b.start); return s && s >= from && s < to; })
  .sort((a, b) => String(a.start).localeCompare(String(b.start)));

const minutesOf = b => {
  const s = parseT(b.start), e = parseT(b.end);
  return (s && e) ? Math.max(0, (e - s) / 60000) : 0;
};

/** 只算落在窗口里的那一段 */
const clipMinutes = (b, from, to) => {
  const s = parseT(b.start), e = parseT(b.end);
  if (!s || !e) return 0;
  return Math.max(0, (Math.min(e, to) - Math.max(s, from)) / 60000);
};

/**
 * 实际做了多久。
 * actualMin 是之前累计的分钟数，runningSince 是这一段的起点；
 * 计时中就把「到现在」这一截也算进去。
 */
function actualMinutesOf(b, now = new Date()) {
  const base = Number(b.actualMin) || 0;
  const rs = parseT(b.runningSince);
  if (!rs) return base;
  return base + Math.max(0, (now - rs) / 60000);
}

/** 结束这一段计时，把这一截折进 actualMin */
function foldRunning(b, now = new Date()) {
  const rs = parseT(b.runningSince);
  if (!rs) return Number(b.actualMin) || 0;
  b.actualMin = Math.round((Number(b.actualMin || 0) + Math.max(0, (now - rs) / 60000)) * 10) / 10;
  b.runningSince = null;
  return b.actualMin;
}

/** 当前正在计时的那一块（同一时间只允许一块） */
const runningBlock = db => db.blocks.find(b => !!b.runningSince) || null;

/* ---------------- 统计 ---------------- */
function byCatStats(blocks) {
  const acc = new Map(), detail = new Map();
  for (const b of blocks) {
    const m = minutesOf(b);
    if (m <= 0) continue;
    const k = normCat(b.cat);
    acc.set(k, (acc.get(k) || 0) + m);
    if (!detail.has(k)) detail.set(k, []);
    detail.get(k).push({ title: b.title, minutes: Math.round(m), start: b.start, done: !!b.done });
  }
  const total = [...acc.values()].reduce((a, b) => a + b, 0);
  return {
    total: Math.round(total),
    items: ALL_CATS
      .filter(c => acc.has(c.key))
      .map(c => ({
        key: c.key, name: c.name, emoji: c.emoji, color: c.color,
        minutes: Math.round(acc.get(c.key)),
        pct: total > 0 ? Math.round(acc.get(c.key) / total * 100) : 0,
        detail: (detail.get(c.key) || []).sort((a, b) => b.minutes - a.minutes),
      }))
      .sort((a, b) => b.minutes - a.minutes),
  };
}

/** 按任务聚合 —— 挂了 taskId 的按 id 归，没挂的按标题归 */
function byTaskStats(blocks) {
  const acc = new Map();
  const now = new Date();
  for (const b of blocks) {
    const m = minutesOf(b);
    if (m <= 0) continue;
    const key = b.taskId || ('t:' + String(b.title || '').trim());
    if (!acc.has(key)) {
      acc.set(key, { key, title: b.title, cat: normCat(b.cat), minutes: 0, actual: 0, count: 0, days: new Set() });
    }
    const o = acc.get(key);
    o.minutes += m;
    o.actual += actualMinutesOf(b, now);
    o.count++;
    const d = parseT(b.start);
    if (d) o.days.add(dayKey(d));
  }
  return [...acc.values()]
    .map(o => ({ ...o, minutes: Math.round(o.minutes), actual: Math.round(o.actual), days: [...o.days].sort() }))
    .sort((a, b) => b.minutes - a.minutes);
}

/** 近 N 周各类时长（周三~周二），画堆叠柱 */
function trendStats(db, weeks = 8) {
  const out = [];
  const { anchor } = frame();
  for (let i = weeks - 1; i >= 0; i--) {
    const from = weekStart(addDays(anchor, -7 * i));
    const to = atHour(addDays(from, 7), DAY_END_HOUR);
    const cats = {};
    let total = 0;
    for (const b of blocksIn(db, from, to)) {
      const m = minutesOf(b);
      if (m <= 0) continue;
      const k = normCat(b.cat);
      cats[k] = (cats[k] || 0) + m;
      total += m;
    }
    out.push({
      from: T(from), to: T(to),
      label: `${from.getMonth() + 1}/${from.getDate()}`,
      total: Math.round(total),
      cats,
    });
  }
  return out;
}

/** 计划 vs 实际：排了多久 / 真正做了多久 / 完成多久 / 完成率，外加近 7 天的小柱 */
function planStats(db, from, to) {
  const bs = blocksIn(db, from, to);
  const now = new Date();
  const planned = bs.reduce((s, b) => s + minutesOf(b), 0);
  const actual = bs.reduce((s, b) => s + actualMinutesOf(b, now), 0);
  const done = bs.filter(b => b.done).reduce((s, b) => s + minutesOf(b), 0);
  const timed = bs.filter(b => actualMinutesOf(b, now) > 0).length;

  const { anchor } = frame();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const a = addDays(anchor, -i);
    const f = atHour(a, DAY_START_HOUR);
    const t = atHour(addDays(a, 1), DAY_END_HOUR);
    const list = blocksIn(db, f, t);
    days.push({
      label: WD[a.getDay()],
      date: dayKey(a),
      planned: Math.round(list.reduce((s, b) => s + minutesOf(b), 0)),
      actual: Math.round(list.reduce((s, b) => s + actualMinutesOf(b, now), 0)),
      done: Math.round(list.filter(b => b.done).reduce((s, b) => s + minutesOf(b), 0)),
    });
  }
  return {
    planned: Math.round(planned),
    actual: Math.round(actual),
    done: Math.round(done),
    timed,
    rate: planned > 0 ? Math.round(done / planned * 100) : 0,
    days,
  };
}

function rangeOf(range, dayStr = null) {
  const { anchor, dayStart, dayEnd } = frame(new Date(), dayStr);
  const today = dayKey(anchorOf(new Date())) === dayKey(anchor);
  const dayLabel = `${anchor.getMonth() + 1}月${anchor.getDate()}日`;
  if (range === 'week') {
    const from = weekStart(anchor);
    const last = addDays(from, 6);
    return {
      from, to: atHour(addDays(from, 7), DAY_END_HOUR),
      label: `${from.getMonth() + 1}/${from.getDate()} – ${last.getMonth() + 1}/${last.getDate()}`,
    };
  }
  if (range === 'month') {
    const from = atHour(new Date(anchor.getFullYear(), anchor.getMonth(), 1), DAY_START_HOUR);
    return {
      from, to: atHour(new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1), DAY_END_HOUR),
      label: `${anchor.getFullYear()}年${anchor.getMonth() + 1}月`,
    };
  }
  return { from: dayStart, to: dayEnd, label: today ? '今天' : dayLabel };
}

function buildStats(db, range = 'today', dayStr = null) {
  const { from, to, label } = rangeOf(range, dayStr);
  const bs = blocksIn(db, from, to);
  return {
    ok: true, range, label, from: T(from), to: T(to),
    byCat: byCatStats(bs),
    byTask: byTaskStats(bs).slice(0, 12),
    trend: trendStats(db, 8),
    plan: planStats(db, from, to),
  };
}

/* ---------------- 组装一天的界面数据 ---------------- */
function buildState(db, dayStr = null) {
  const now = new Date();
  const { anchor, dayStart, dayEnd } = frame(now, dayStr);
  const todayAnchor = anchorOf(now);
  const isToday = dayKey(todayAnchor) === dayKey(anchor);

  const events = blocksIn(db, dayStart, dayEnd).map(b => ({ ...b, cat: normCat(b.cat) }));
  const planned = events.reduce((s, b) => s + clipMinutes(b, dayStart, dayEnd), 0);
  const actual = events.reduce((s, b) => s + actualMinutesOf(b, now), 0);

  // 正在计时的那一块。baseMin 不含「从 runningSince 到现在」这一截，前端自己往上加。
  const run = runningBlock(db);
  const timer = run ? {
    blockId: run.id,
    taskId: run.taskId || null,
    title: run.title,
    cat: normCat(run.cat),
    start: run.start,
    end: run.end,
    runningSince: run.runningSince,   // 字段名跟块上保持一致，前端一套算法通用
    baseMin: Math.round((Number(run.actualMin) || 0) * 10) / 10,
  } : null;

  // 每条待办今天实际做了多久（只有排进时间轴、挂上 taskId 的才算）
  const actualByTask = new Map();
  for (const b of events) {
    if (!b.taskId) continue;
    actualByTask.set(b.taskId, (actualByTask.get(b.taskId) || 0) + actualMinutesOf(b, now));
  }

  const catRank = Object.fromEntries(ALL_CATS.map((c, i) => [c.key, i]));
  const tasks = [...db.tasks].sort((a, b) =>
    (catRank[normCat(a.cat)] - catRank[normCat(b.cat)])
    || ((a.order || 0) - (b.order || 0))
    || String(a.createdAt || '').localeCompare(String(b.createdAt || '')))
    .map(t => ({ ...t, todayActual: Math.round(actualByTask.get(t.id) || 0) }));

  // 托盘项今天排过没有（按名字认）
  const onToday = new Set(events.map(e => String(e.title || '').trim()));
  const tray = [...db.tray]
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .map(t => ({ ...t, cat: normCat(t.cat), onToday: onToday.has(String(t.title || '').trim()) }));

  const ideas = [...db.ideas].sort((a, b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)
    || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  return {
    ok: true,
    now: T(now),
    anchor: dayKey(anchor),
    isToday,
    prevDay: dayKey(addDays(anchor, -1)),
    nextDay: dayKey(addDays(anchor, 1)),
    todayKey: dayKey(todayAnchor),
    dayStart: T(dayStart),
    dayEnd: T(dayEnd),
    events,
    tasks,
    tray,
    ideas,
    timer,
    plannedMinutes: Math.round(planned),
    actualMinutes: Math.round(actual),
    autoTimer: db.meta.autoTimer !== false,
    cutHours: Array.isArray(db.meta.cutHours) && db.meta.cutHours.length
      ? db.meta.cutHours : [18, 24],
    dayMinutes: Math.round((dayEnd - dayStart) / 60000),
    stats: buildStats(db, 'today', dayKey(anchor)),
    warn: [],
  };
}

/* ---------------- 撤销 ---------------- */
// 每次写之前留一张整库快照 —— 比逐条记反向操作可靠得多，也不会漏。
const undoStack = [];
const MAX_UNDO = 60;

function remember(label, snap) {
  undoStack.push({ label, snap, at: Date.now() });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

/** 撤销上一步：把整库快照原样写回去 */
async function undo() {
  const op = undoStack.pop();
  if (!op) return { ok: false, error: '没有可撤销的操作了' };
  await dbApi.restore(op.snap);
  return { ok: true, label: op.label };
}
const undoable = () => {
  const op = undoStack[undoStack.length - 1];
  return { ok: true, label: op ? op.label : null };
};
const clearUndo = () => { undoStack.length = 0; };

/* ---------------- 写操作 ---------------- */
/**
 * 数据层由外面注入：电脑上是 data/store.json，手机上是 localStorage。
 * 内核只认 snapshot / mutate / restore 这三个动作。
 */
let dbApi = null;
function useStore(api) { dbApi = api; }

/** 包一层：快照 → 改 → 记账，失败不落盘 */
const w = (label, fn) => async body => {
  const before = dbApi.snapshot();
  const out = await dbApi.mutate(db => fn(db, body));
  remember(typeof label === 'function' ? label(body) : label, before);
  return { ok: true, ...(out || {}) };
};

const findTask = (db, id) => {
  const t = db.tasks.find(x => x.id === id);
  if (!t) throw bad('这条待办已经不存在了');
  return t;
};
const findBlock = (db, id) => {
  const b = db.blocks.find(x => x.id === id);
  if (!b) throw bad('这条日程已经不存在了');
  return b;
};
const findTray = (db, id) => {
  const t = db.tray.find(x => x.id === id);
  if (!t) throw bad('这个托盘项已经不存在了');
  return t;
};
const findIdea = (db, id) => {
  const i = db.ideas.find(x => x.id === id);
  if (!i) throw bad('这条灵感已经不存在了');
  return i;
};

/** 同类里最大的 order + 1，新条目排最后 */
const nextOrder = (list, cat) =>
  list.filter(x => normCat(x.cat) === cat).reduce((m, x) => Math.max(m, x.order || 0), -1) + 1;

const handlers = {
  /* ---- 待办 ---- */
  '/api/task/add': w(b => `加待办「${b.title}」`, (db, b) => {
    const cat = normCat(b.cat);
    const t = {
      id: newId('t'),
      title: mustText(b.title, '待办内容'),
      cat,
      order: nextOrder(db.tasks, cat),
      estMin: Math.max(0, optInt(b.estMin, 60)),
      note: String(b.note || '').slice(0, 2000),
      done: false,
      createdAt: stamp(new Date()),
      doneAt: null,
    };
    db.tasks.push(t);
    return { id: t.id };
  }),

  '/api/task/update': w('改待办', (db, b) => {
    const t = findTask(db, mustId(b.id));
    if (b.title !== undefined) t.title = mustText(b.title, '待办内容');
    if (b.cat !== undefined) {
      const cat = normCat(b.cat);
      if (cat !== normCat(t.cat)) { t.cat = cat; t.order = nextOrder(db.tasks, cat); }
    }
    if (b.estMin !== undefined) t.estMin = Math.max(0, optInt(b.estMin, t.estMin));
    if (b.note !== undefined) t.note = String(b.note || '').slice(0, 2000);
    if (b.done !== undefined) {
      t.done = !!b.done;
      t.doneAt = t.done ? stamp(new Date()) : null;
    }
    return { id: t.id };
  }),

  '/api/task/delete': w(b => `删待办「${b.title || ''}」`, (db, b) => {
    const id = mustId(b.id);
    findTask(db, id);
    db.tasks = db.tasks.filter(x => x.id !== id);
    // 挂在这条待办上的日程块保留，只解开关联 —— 已经花掉的时间不该跟着消失
    for (const blk of db.blocks) if (blk.taskId === id) blk.taskId = null;
    return { id };
  }),

  /** 拖动排序：给该类一个完整的 id 顺序 */
  '/api/task/reorder': w('调整优先级', (db, b) => {
    const cat = normCat(b.cat);
    const ids = Array.isArray(b.ids) ? b.ids.map(String) : [];
    if (!ids.length) throw bad('缺少 ids');
    const mine = db.tasks.filter(t => normCat(t.cat) === cat);
    const rank = new Map(ids.map((id, i) => [id, i]));
    // 名单里没提到的排在后面，保持原来的相对顺序
    mine.sort((a, c) => {
      const ra = rank.has(a.id) ? rank.get(a.id) : 1e6 + (a.order || 0);
      const rc = rank.has(c.id) ? rank.get(c.id) : 1e6 + (c.order || 0);
      return ra - rc;
    });
    mine.forEach((t, i) => { t.order = i; });
    return { count: mine.length };
  }),

  /* ---- 托盘 ---- */
  '/api/tray/add': w(b => `加托盘项「${b.title}」`, (db, b) => {
    const t = {
      id: newId('r'),
      title: mustText(b.title, '托盘内容'),
      cat: normCat(b.cat),
      minutes: Math.max(5, optInt(b.minutes, 60)),
      order: db.tray.reduce((m, x) => Math.max(m, x.order || 0), -1) + 1,
    };
    db.tray.push(t);
    return { id: t.id };
  }),

  '/api/tray/update': w('改托盘项', (db, b) => {
    const t = findTray(db, mustId(b.id));
    if (b.title !== undefined) t.title = mustText(b.title, '托盘内容');
    if (b.cat !== undefined) t.cat = normCat(b.cat);
    if (b.minutes !== undefined) t.minutes = Math.max(5, optInt(b.minutes, t.minutes));
    return { id: t.id };
  }),

  '/api/tray/delete': w(b => `删托盘项「${b.title || ''}」`, (db, b) => {
    const id = mustId(b.id);
    findTray(db, id);
    db.tray = db.tray.filter(x => x.id !== id);
    return { id };
  }),

  /* ---- 日程块 ---- */
  '/api/block/add': w(b => `排入「${b.title}」`, (db, b) => {
    const start = mustTime(b.start, '开始时间');
    const s = parseT(start);
    const end = b.end
      ? mustTime(b.end, '结束时间')
      : T(new Date(s.getTime() + Math.max(5, optInt(b.minutes, 60)) * 60000));
    if (parseT(end) <= s) throw bad('结束时间必须晚于开始时间');
    const blk = {
      id: newId('b'),
      title: mustText(b.title, '日程内容'),
      cat: normCat(b.cat),
      taskId: b.taskId ? String(b.taskId) : null,
      start, end,
      done: false,
      doneAt: null,
      actualMin: 0,        // 已经做完的实际分钟数（累计）
      runningSince: null,  // 正在计时的话，这一段的起点
      createdAt: stamp(new Date()),
    };
    db.blocks.push(blk);
    return { id: blk.id, start: blk.start, end: blk.end };
  }),

  '/api/block/update': w('改日程', (db, b) => {
    const blk = findBlock(db, mustId(b.id));
    if (b.title !== undefined) blk.title = mustText(b.title, '日程内容');
    if (b.cat !== undefined) blk.cat = normCat(b.cat);
    if (b.start !== undefined) blk.start = mustTime(b.start, '开始时间');
    if (b.end !== undefined) blk.end = mustTime(b.end, '结束时间');
    if (parseT(blk.end) <= parseT(blk.start)) throw bad('结束时间必须晚于开始时间');
    if (b.done !== undefined) {
      // 标完成就顺手把当前这一段计时收掉，别让实际时长一直往上涨
      if (b.done) foldRunning(blk);
      blk.done = !!b.done;
      blk.doneAt = blk.done ? stamp(new Date()) : null;
    }
    if (b.actualMin !== undefined) blk.actualMin = Math.max(0, Math.round(Number(b.actualMin) * 10) / 10 || 0);
    return { id: blk.id, start: blk.start, end: blk.end, actualMin: Number(blk.actualMin) || 0 };
  }),

  '/api/block/delete': w(b => `删日程「${b.title || ''}」`, (db, b) => {
    const id = mustId(b.id);
    findBlock(db, id);
    db.blocks = db.blocks.filter(x => x.id !== id);
    return { id };
  }),

  /* ---- 计时（倒计时 + 实际时长） ---- */
  /**
   * 开始一个倒计时。传 blockId 就计这一块；传 taskId 就找今天这一块的日程，
   * 没排过 / 已经过去，就从现在开一块（时长用预计）。
   * 同一时间只允许一块在跑，别的会先被收掉。
   */
  '/api/timer/start': w('开始计时', (db, b) => {
    const now = new Date();
    let blk = null;

    if (b.blockId) {
      blk = findBlock(db, mustId(b.blockId));
    } else if (b.taskId) {
      const t = findTask(db, mustId(b.taskId));
      const { dayStart, dayEnd } = frame(now);
      const mine = db.blocks
        .filter(x => x.taskId === t.id && !x.done)
        .filter(x => { const s = parseT(x.start); return s && s >= dayStart && s < dayEnd; })
        .sort((a, c) => String(a.start).localeCompare(String(c.start)));

      const live = mine.find(x => parseT(x.start) <= now && now < parseT(x.end));
      const soon = mine.find(x => parseT(x.start) > now);

      if (live) blk = live;
      else if (soon) {
        // 提前开始：保留原时长，把这块挪到现在
        const dur = Math.max(5, (parseT(soon.end) - parseT(soon.start)) / 60000);
        soon.start = T(now);
        soon.end = T(new Date(now.getTime() + dur * 60000));
        blk = soon;
      } else {
        blk = {
          id: newId('b'),
          title: t.title,
          cat: normCat(t.cat),
          taskId: t.id,
          start: T(now),
          end: T(new Date(now.getTime() + Math.max(5, t.estMin || 60) * 60000)),
          done: false, doneAt: null,

<script>
/* ==========================================================================
   手机版的"服务端" —— 用 localStorage 顶上，不经过网络。
   由 tools/build-mobile.js 插到主脚本之前（主脚本一上来就会调 /api/state）。
   接口名和返回值和电脑上的 server.js 完全一致。
   ========================================================================== */
(function () {
  const CORE = window.CORE;
  const KEY = 'desk.schedule.v1';

  // 底部面板的状态必须赶在主脚本 layout() 之前定下来，
  // 否则时间轴会按错误的高度算每小时多少像素。
  // 默认收起 —— 手机上时间轴才是主角，要看待办点底下的标签就行。
  try {
    if (localStorage.getItem('desk.sideOpen') === '1') document.body.classList.add('side-open');
  } catch { }

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      return CORE.normalize(raw ? JSON.parse(raw) : null);
    } catch (e) {
      console.warn('本地数据读不出来：' + e.message);
      return CORE.empty();
    }
  }

  function write(db) {
    db.meta = db.meta || {};
    db.meta.updatedAt = CORE.stamp(new Date());
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
    } catch (e) {
      throw new Error('手机存不下了，先导出备份清一清：' + e.message);
    }
  }

  CORE.useStore({
    snapshot: () => JSON.parse(JSON.stringify(read())),
    mutate(fn) {
      const db = read();
      const out = fn(db);          // 抛异常就整次作废，跟电脑上一样
      write(db);
      return out === undefined ? null : out;
    },
    restore(snap) {
      const db = read();
      for (const k of ['tasks', 'tray', 'blocks', 'ideas']) db[k] = snap[k] || [];
      db.meta = { ...db.meta, ...(snap.meta || {}) };
      write(db);
    },
  });

  /* ---- 备份：导出 / 导入 / 清空 ---- */
  window.DESK_DB = {
    dump: () => JSON.stringify(read(), null, 2),
    load(text) {
      const db = CORE.normalize(JSON.parse(text));
      write(db);
      CORE.clearUndo();
      return db;
    },
    wipe() { localStorage.removeItem(KEY); CORE.clearUndo(); },
    read,
  };

  const qs = url => {
    const i = url.indexOf('?');
    return i < 0 ? {} : Object.fromEntries(new URLSearchParams(url.slice(i + 1)));
  };

  window.LOCAL_API = async function (url, body) {
    try {
      const path = url.split('?')[0];
      const p = qs(url);
      const day = CORE.isDayStr(p.day) ? p.day : null;

      if (path === '/api/ping') return { ok: true, local: true };
      if (path === '/api/state') return CORE.buildState(read(), day);
      if (path === '/api/stats') return CORE.buildStats(read(), p.range || 'today', day);
      if (path === '/api/undoable') return CORE.undoable();
      if (path === '/api/undo') return await CORE.undo();

      const h = CORE.handlers[path];
      if (!h) return { ok: false, error: '没有这个接口：' + path };
      return await h(body || {});
    } catch (e) {
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };
})();

</script>

async function call(url, body) {

/**
 * 时间轴一屏铺 09:00–18:00，所以默认停在最上面。
 * 只有「现在」不在 09:00–18:00 里（比如深夜）才自动滚到看得见现在。
 * 看别的日子一律回到最上面。

function scrollToNow() {
  if (!S) return;

    await call('/api/block/add', {
      title: item.title, cat: item.cat,
      taskId: item.kind === 'task' ? item.id : null,
      start: T(t), minutes: item.estMin || item.minutes || DEFAULT_MIN,
    });
    await load();
    toast(`已排入「${item.title}」`);
  });
}

/* ================= 已有日程块：拖动 / 拉长 / 点开 ================= */
function bindBlock(el, ev) {
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !S) return;
    const mode = e.target.classList.contains('rz') ? 'resize' : 'move';
    drag = {
      el, ev, mode, y0: e.clientY, moved: false,
      s0: parse(ev.start), e0: parse(ev.end || ev.start),
    };
    try { el.setPointerCapture(e.pointerId); } catch { }
    e.preventDefault(); e.stopPropagation();
    closePop();
  });

  el.addEventListener('pointermove', e => {
    if (!drag || drag.el !== el) return;
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) < 4) return;
    drag.moved = true;
    const dMin = Math.round((dy / PXH) * 60 / SNAP) * SNAP;

    if (drag.mode === 'move') {
      el.classList.add('moving');
      const totalMin = Math.round((parse(S.dayEnd) - parse(S.dayStart)) / 60000);
      const dur = Math.round((drag.e0 - drag.s0) / 60000);
      let shift = dMin;
      const startMin = (drag.s0 - parse(S.dayStart)) / 60000 + shift;
      if (startMin < 0) shift -= startMin;
      if (startMin + dur > totalMin) shift -= (startMin + dur - totalMin);
      el.style.top = ((drag.s0 - parse(S.dayStart)) / 60000 + shift) / 60 * PXH + 'px';
      drag.shift = shift;
    } else {
      el.classList.add('resizing');
      const dur = Math.max(SNAP, Math.round((drag.e0 - drag.s0) / 60000) + dMin);
      el.style.height = Math.max(9, dur / 60 * PXH) + 'px';
      drag.dur = dur;
    }
  });

  const finish = async e => {
    if (!drag || drag.el !== el) return;
    const d = drag; drag = null;
    el.classList.remove('moving','resizing');
    try { el.releasePointerCapture(e.pointerId); } catch { }
    if (!d.moved) { openPop(d.ev, el); return; }

    if (d.mode === 'move') {
      if (!d.shift) return;
      const ns = new Date(d.s0.getTime() + d.shift * 60000);
      const ne = new Date(d.e0.getTime() + d.shift * 60000);
      await call('/api/block/update', { id: d.ev.id, start: T(ns), end: T(ne) });
    } else {
      const dur = d.dur || Math.round((d.e0 - d.s0) / 60000);
      if (dur === Math.round((d.e0 - d.s0) / 60000)) return;
      await call('/api/block/update', { id: d.ev.id, end: T(new Date(d.s0.getTime() + dur * 60000)) });
    }
    await load();
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', () => { drag = null; render(); });
}

/* ================= 日程块弹层 ================= */
function openPop(ev, el) {
  popBlock = ev;
  const pop = $('pop');
  const c = catOf(ev.cat);
  const s = parse(ev.start), e = parse(ev.end || ev.start);
  const act0 = actualOf(ev);
  const running = isRunning(ev.id);
  pop.style.setProperty('--c', c.color);
  pop.innerHTML = `
    <div class="ph"><span class="pd"></span><span class="num">${hhmm(s)} – ${hhmm(e)}</span>
      <span style="margin-left:auto" class="num">${fmtDur((e - s) / 60000)}</span></div>
    <input type="text" id="pop-title" value="${esc(ev.title)}" placeholder="日程内容">
    <div class="ptime">
      <input type="time" id="pop-start" value="${hhmm(s)}">
      <span>→</span>
      <input type="time" id="pop-end" value="${hhmm(e)}">
    </div>
    <div class="catsel" id="pop-cats">
      ${CATS.map(x => `<button data-cat="${x.key}" class="${x.key===normC(ev.cat)?'on':''}"
          style="--c:${x.color};--s:${x.soft}"><span class="e">${x.emoji}</span>${x.name}</button>`).join('')}
    </div>
    <div class="pactual">
      <span>计划 <b>${fmtDur((e - s) / 60000)}</b></span>
      <span>实际 <b style="color:#21896A">${act0 >= 1 ? fmtDur(act0) : '—'}</b></span>
      ${running ? '<span class="run">● 计时中</span>' : ''}
    </div>
    <div class="prow">
      <button class="pbtn ${running ? 'warn' : 'ok'}" data-act="${running ? 'stop' : 'start'}">
        ${running ? '结束计时' : '开始计时'}</button>
      <button class="pbtn" data-act="extend">＋10 分</button>
    </div>
    <div class="prow">
      <button class="pbtn" data-act="up15">早 15 分</button>
      <button class="pbtn" data-act="down15">晚 15 分</button>
    </div>
    <div class="prow">
      <button class="pbtn" data-act="shrink">缩短 15 分</button>
      <button class="pbtn" data-act="grow">拉长 15 分</button>
    </div>
    <div class="prow">
      <button class="pbtn ${ev.done?'ok':''}" data-act="done">${ev.done?'✓ 已完成':'标记完成'}</button>
      <button class="pbtn warn" data-act="del">删除</button>
    </div>`;
  pop.classList.add('on');

  const r = el.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  let left = r.left + 16, top = r.bottom + 6;
  if (left + pr.width > window.innerWidth - 10) left = window.innerWidth - pr.width - 10;
  if (top + pr.height > window.innerHeight - 10) top = Math.max(8, r.top - pr.height - 6);
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = top + 'px';

  pop.querySelectorAll('[data-act]').forEach(b => { b.onclick = () => act(b.dataset.act); });
  pop.querySelectorAll('[data-cat]').forEach(b => {
    b.onclick = async () => {
      await call('/api/block/update', { id: ev.id, cat: b.dataset.cat });
      closePop(); await load();
    };
  });

  // 只有真的改了才保存 —— 否则点开又关掉会往撤销栈里塞空操作
  const save = async () => {
    const title = $('pop-title').value.trim();
    const st = $('pop-start').value, en = $('pop-end').value;
    if (!title || !st || !en) return;
    const day = ev.start.slice(0, 10);
    let sIso = `${day}T${st}`, eIso = `${day}T${en}`;
    if (new Date(eIso) <= new Date(sIso)) {
      const d2 = new Date(day + 'T12:00'); d2.setDate(d2.getDate() + 1);
      eIso = `${T(d2).slice(0,10)}T${en}`;
    }
    if (title === ev.title && sIso === ev.start && eIso === ev.end) return;
    await call('/api/block/update', { id: ev.id, title, start: sIso, end: eIso });
    closePop(); await load();
  };
  $('pop-title').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  $('pop-title').addEventListener('blur', save);
  $('pop-start').addEventListener('change', save);
  $('pop-end').addEventListener('change', save);
}
const closePop = () => { $('pop').classList.remove('on'); popBlock = null; };

async function act(a) {
  const ev = popBlock;
  if (!ev) return;
  const s = parse(ev.start), e = parse(ev.end || ev.start);
  const MIN = 60000;
  closePop();

  if (a === 'up15')   await call('/api/block/update', { id: ev.id, start: T(new Date(s-MIN*15)), end: T(new Date(e-MIN*15)) });
  else if (a === 'down15') await call('/api/block/update', { id: ev.id, start: T(new Date(s+MIN*15)), end: T(new Date(e+MIN*15)) });
  else if (a === 'start') { await startTimer({ blockId: ev.id }); return; }
  else if (a === 'stop') { await stopTimer(false); return; }
  else if (a === 'extend') { await extendTimer(10); return; }
  else if (a === 'shrink') {
    if (e - s < 30*MIN) { showErr('再短就没了'); return; }
    await call('/api/block/update', { id: ev.id, end: T(new Date(e-MIN*15)) });
  }
  else if (a === 'grow') await call('/api/block/update', { id: ev.id, end: T(new Date(e+MIN*15)) });
  else if (a === 'done') {
    await call('/api/block/update', { id: ev.id, done: !ev.done });
    if (!ev.done) {
      const el = document.querySelector(`.ev[data-id="${ev.id}"]`);
      if (el) { const r = el.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2); }
    }
    await load();
    if (!ev.done) toast(`「${ev.title}」完成 🎉`);
    return;
  }
  else if (a === 'del') {
    await call('/api/block/delete', { id: ev.id });
    await load();
    toast('已删除这一条');
    return;
  }
  await load();
}

/** 标记完成时蹦几颗小星星 */
function burst(x, y) {
  const chars = ['✨','⭐','💫','🌟'];
  for (let i = 0; i < 4; i++) {
    const el = document.createElement('div');
    el.className = 'spark';
    el.textContent = chars[i % chars.length];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', (Math.random()*90-45) + 'px');
    el.style.setProperty('--dy', (-45 - Math.random()*55) + 'px');
    el.style.animationDelay = (i*60) + 'ms';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

/* ================= 倒计时 ================= */
/** 一条短促的提示音，到点时响一次。浏览器不给放就算了，不报错。 */
function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    [0, 0.2].forEach((delay, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = i ? 880 : 660;
      const t0 = ac.currentTime + delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + 0.3);
    });
    setTimeout(() => { try { ac.close(); } catch { } }, 1000);
  } catch { }
}

/** 只改数字，不重画整个界面 —— 每秒跑一次 */
function paintTimer(now) {
  const el = $('timer');
  const t = S && S.timer;
  if (!t) { el.classList.remove('on'); return; }
  el.classList.add('on');

  const c = catOf(t.cat);
  el.style.setProperty('--c', c.color);
  $('tm-em').textContent = c.emoji;
  $('tm-name').textContent = t.title;

  const start = parse(t.start), end = parse(t.end);
  const leftMs = end - now;
  const over = leftMs <= 0;
  const abs = Math.abs(leftMs);
  const mm = Math.floor(abs / 60000), ss = Math.floor(abs % 60000 / 1000);
  $('tm-big').innerHTML =
    `${over ? '+' : ''}${p2(mm)}:${p2(ss)}<small>${over ? '已超时' : '剩余'}</small>`;

  const spent = actualOf(t, now);
  const total = Math.max(1, (end - start) / 60000);
  $('tm-side').innerHTML =
    `计划 ${fmtDur(total)} · 到 ${hhmm(end)}<br>已做 ${fmtDur(spent)}`;

  const pct = Math.max(0, Math.min(100, (now - start) / (end - start) * 100));
  $('tm-bar-i').style.width = pct + '%';

  el.classList.toggle('low', !over && leftMs < 5 * 60000);
  el.classList.toggle('over', over);

  if (over && !beeped.has(t.blockId)) { beeped.add(t.blockId); chime(); }
  if (over && !alerted.has(t.blockId)) { alerted.add(t.blockId); openHurry(t); }
}

/* ---- 超时了，弹一个「快快快！」 ---- */
function openHurry(t) {
  const over = Math.max(0, (new Date() - parse(t.end)) / 60000);
  $('hurry-sub').innerHTML =
    `「<b>${esc(t.title)}</b>」超了 <b>${fmtDur(over)}</b><br>`
    + `${hhmm(parse(t.end))} 就该结束了，现在 ${hhmm(new Date())}`;
  $('hurry').classList.add('on');
}
const closeHurry = () => $('hurry').classList.remove('on');

$('hurry').querySelectorAll('[data-h]').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.h;
    closeHurry();
    if (k === 'done') stopTimer(true);
    else if (k === 'extend') extendTimer(10);
    // later：关掉弹窗，计时照跑，倒计时卡片保持红色
  };
});

async function startTimer(payload) {
  const r = await call('/api/timer/start', payload);
  if (r.ok) await load();
  return r;
}

async function stopTimer(finish) {
  const t = S && S.timer;
  if (!t) return;
  // 手动按掉的，今天别再自动弹出来
  if (!finish) { autoBlocked.add(t.blockId); saveAutoBlocked(); }
  const r = await call('/api/timer/stop', { blockId: t.blockId, finish: !!finish });
  beeped.delete(t.blockId); alerted.delete(t.blockId);
  await load();
  if (!r.ok) return;
  if (finish) {
    toast(`做完了，实际 ${fmtDur(r.actualMin)} 🎉`);
    const el = document.querySelector(`.ev[data-id="${t.blockId}"]`);
    if (el) { const b = el.getBoundingClientRect(); burst(b.left + b.width/2, b.top + b.height/2); }
  } else {
    toast(`先停一下，实际做了 ${fmtDur(r.actualMin)}`);
  }
}

async function extendTimer(minutes) {
  const t = S && S.timer;
  if (!t) return;
  const r = await call('/api/timer/extend', { blockId: t.blockId, minutes });
  if (!r.ok) return;
  beeped.delete(t.blockId);
  alerted.delete(t.blockId);
  await load();
  toast(`往后延了 ${minutes} 分钟，到 ${hhmm(parse(r.end))}`);
}

/** 到点了还没开始做的，自动把倒计时弹出来（只在看今天的时候） */
function autoMaybe(now) {
  if (!S || S.timer || !S.autoTimer || !S.isToday) return;
  for (const e of S.events) {
    if (e.done || e.runningSince) continue;
    if (autoBlocked.has(e.id) || autoTried.has(e.id)) continue;
    const s = parse(e.start), en = parse(e.end);
    if (!s || !en) continue;
    if (s <= now && now < en) {
      autoTried.add(e.id);
      startTimer({ blockId: e.id });
      return;
    }
  }
}

$('timer').querySelectorAll('[data-t]').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.t;
    if (k === 'done') stopTimer(true);
    else if (k === 'extend') extendTimer(10);
    else stopTimer(false);
  };
});
$('tm-x').onclick = () => stopTimer(false);

document.addEventListener('pointerdown', e => {
  if ($('pop').contains(e.target)) return;
  if (e.target.closest('.ev')) return;
  closePop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeSheet(); closePomo(); closeHurry(); closeCuts(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); }
  const tag = (document.activeElement || {}).tagName;
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && tag !== 'INPUT' && tag !== 'TEXTAREA') {
    e.preventDefault(); openSheet('task');

});

/* ================= 渲染 ================= */
function render() {
  if (!S) return;
  layout();
  renderBar();
  renderFit(new Date());
  renderTimeline();
  renderSide();
  if (render._day !== S.anchor) { render._day = S.anchor; scrollToNow(); }
  if ($('ov').classList.contains('on')) renderStats();
}

function renderBar() {
  const now = new Date();
  const dayStart = parse(S.dayStart);
  const d = dayDiff(S.anchor, S.todayKey);
  const rel = d === 0 ? '今天' : d === -1 ? '昨天' : d === 1 ? '明天'
    : d === -2 ? '前天' : d === 2 ? '后天' : '';
  $('date').innerHTML = `${dayStart.getMonth()+1}月${dayStart.getDate()}日`
    + `<em class="${d===0?'today':''}">${WD[dayStart.getDay()]}${rel && d ? ' · ' + rel : ''}</em>`;
  $('day-today').hidden = !!S.isToday;

  const nx = $('next');
  if (!S.isToday) {
    const doneN = S.events.filter(e => e.done).length;
    nx.className = 'next idle';
    nx.innerHTML = `<span class="dot"></span><span>${rel || '这一天'}排了 <b>${fmtDur(S.plannedMinutes)}</b>`
      + ` · ${S.events.length} 件事${doneN ? `（已完成 ${doneN}）` : ''}</span>`;
  } else {
    const live = S.events.find(e => parse(e.start) <= now && now < parse(e.end));
    const up = S.events.filter(e => parse(e.start) > now)
      .sort((a,b) => parse(a.start)-parse(b.start))[0];
    if (live) {
      nx.className = 'next';
      nx.innerHTML = `<span class="dot"></span><span>正在进行 <b>${esc(live.title)}</b>　还剩 <b>${Math.round((parse(live.end)-now)/60000)} 分钟</b>（到 ${hhmm(parse(live.end))}）</span>`;
    } else if (up) {
      nx.className = 'next';
      nx.innerHTML = `<span class="dot"></span><span>距 <b>${esc(up.title)}</b> 还有 <b>${Math.round((parse(up.start)-now)/60000)} 分钟</b>（${hhmm(parse(up.start))}）</span>`;
    } else {
      nx.className = 'next idle';
      nx.innerHTML = `<span class="dot"></span><span>今天没有排定的日程了　计划 <b>${fmtDur(S.plannedMinutes)}</b> · 实际 <b>${fmtDur(S.actualMinutes)}</b></span>`;
    }
  }

  const pct = Math.min(100, Math.round(S.plannedMinutes / S.dayMinutes * 100));
  const r = 14, c = 2 * Math.PI * r;
  $('ring').innerHTML = `
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r="${r}" fill="none" stroke="#F1E5D8" stroke-width="3.5"/>
      <circle cx="17" cy="17" r="${r}" fill="none" stroke="#E4573D" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}"/>
    </svg><b class="num">${pct}%</b>`;
  $('ring').title = `今天排了 ${fmtDur(S.plannedMinutes)} / 清醒 ${fmtDur(S.dayMinutes)}　实际做了 ${fmtDur(S.actualMinutes)}`;
}

/* ---- 今天这些日程，到下午 6 点干不干得完 ---- */
/* ---- 今天这些日程，到下一个截止时间干不干得完 ---- */
/**
 * 截止点：默认白天 18:00、晚上 24:00，过了自动用下一个，最后兜底到睡觉时间。
 * 小时数 < 9 的算次日（比如设成 1 就是次日凌晨 1 点）。
 */
function cutAt(dayStart, h) {
  const hh = ((Math.round(Number(h)) % 24) + 24) % 24;
  const d = new Date(dayStart);
  if (hh >= VIEW_FROM) d.setHours(hh, 0, 0, 0);
  else { d.setDate(d.getDate() + 1); d.setHours(hh, 0, 0, 0); }
  return d;
}
const cutLabel = d => (d.getHours() === 0 && d.getMinutes() === 0) ? '24:00' : hhmm(d);

function cutPoints() {
  const hs = (S.cutHours && S.cutHours.length) ? S.cutHours : [18, 24];
  const pts = hs.map(h => cutAt(parse(S.dayStart), h)).sort((a, b) => a - b);
  const end = parse(S.dayEnd);
  if (!pts.length || pts[pts.length - 1] < end) pts.push(end);
  return pts;
}
const nextCut = now => cutPoints().find(p => p > now) || null;

function renderFit(now) {
  const el = $('fit');
  const dayStart = parse(S.dayStart);

  /* ---- 看的是别的日子：昨天回看 / 明天预排 ---- */
  if (!S.isToday) {
    const win = (cutAt(dayStart, 18) - dayStart) / 60000;   // 09:00–18:00 一共多少分钟
    const past = cutAt(dayStart, 18) < now;
    let left = 0;
    for (const e of S.events) {
      if (e.done) continue;
      const s = parse(e.start), en = parse(e.end);
      if (!s || !en) continue;
      left += (en - s) / 60000;
    }
    const diff = win - left;
    el.classList.remove('over', 'tight');

    if (past) {
      $('fit-left').innerHTML = `这天排了 <b>${fmtDur(S.plannedMinutes)}</b>`;
      $('fit-right').innerHTML = `实际做了 <b>${fmtDur(S.actualMinutes)}</b>`;
      $('fit-bar-i').style.width =
        (S.plannedMinutes > 0 ? Math.min(100, S.actualMinutes / S.plannedMinutes * 100) : 0) + '%';
      el.title = '这天已经过去了，看的是记录';
      return;
    }

    el.classList.toggle('over', left > 0 && diff < 0);
    el.classList.toggle('tight', left > 0 && diff >= 0 && diff < 60);
    $('fit-left').innerHTML = left > 0 ? `这天要干 <b>${fmtDur(left)}</b>` : '这天还什么都没排';
    $('fit-right').innerHTML = diff < 0
      ? `09:00–18:00 只有 <b>${fmtDur(win)}</b> · 排多了 <b>${fmtDur(-diff)}</b>`
      : `09:00–18:00 有 <b>${fmtDur(win)}</b> · 富余 <b>${fmtDur(diff)}</b>`;
    $('fit-bar-i').style.width =
      (left > 0 ? Math.max(2, Math.min(100, left / win * 100)) : 0) + '%';
    el.title = '按 09:00–18:00 这一天能用的时间算的';
    return;
  }

  /* ---- 今天 ---- */
  let left = 0;
  for (const e of S.events) {
    if (e.done) continue;
    const s = parse(e.start), en = parse(e.end);
    if (!s || !en || en <= now) continue;          // 已经过去的没标完成，不算进"还要做"
    left += (s <= now ? (en - now) : (en - s)) / 60000;
  }

  const cut = nextCut(now);
  if (!cut) {                                      // 已经过了睡觉时间
    el.classList.remove('over', 'tight');
    $('fit-left').innerHTML = left > 0 ? `今天还剩 <b>${fmtDur(left)}</b> 没做` : `今天的事都做完了 🎉`;
    $('fit-right').innerHTML = '已经过了睡觉时间';
    $('fit-bar-i').style.width = '0%';
    el.title = '今天结束了';
    return;
  }

  const avail = Math.max(0, (cut - now) / 60000);
  const diff = avail - left;
  const ct = cutLabel(cut);

  el.classList.toggle('over', left > 0 && diff < 0);
  el.classList.toggle('tight', left > 0 && diff >= 0 && diff < 60);

  $('fit-left').innerHTML = left > 0
    ? `还要做 <b>${fmtDur(left)}</b>`
    : `到 ${ct} 之前的事都做完了 🎉`;

  if (left <= 0) {
    $('fit-right').innerHTML = `到 ${ct} 还有 <b>${fmtDur(avail)}</b>`;
  } else if (diff < 0) {
    $('fit-right').innerHTML = `到 ${ct} 只剩 <b>${fmtDur(avail)}</b> · 排多了 <b>${fmtDur(-diff)}</b>`;
  } else {
    $('fit-right').innerHTML = `到 ${ct} 有 <b>${fmtDur(avail)}</b> · 富余 <b>${fmtDur(diff)}</b>`;
  }

  const pct = avail > 0 ? left / avail * 100 : (left > 0 ? 100 : 0);
  $('fit-bar-i').style.width = (left > 0 ? Math.max(2, Math.min(100, pct)) : 0) + '%';

  // 待办里还没排进时间轴的，顺手提示一下
  const placed = new Set(S.events.filter(e => !e.done && e.taskId).map(e => e.taskId));
  const open = S.tasks.filter(t => !t.done);
  const loose = open.filter(t => !placed.has(t.id));
  el.title = `未完成的日程合计 ${fmtDur(left)}`
    + `\n从 ${hhmm(now)} 到 ${ct} 有 ${fmtDur(avail)}`
    + `\n截止点：${cutPoints().map(cutLabel).join(' / ')}（点这里改）`
    + `\n\n待办里还有 ${loose.length} 条没排进时间轴（预计 ${fmtDur(loose.reduce((s, t) => s + (t.estMin || 0), 0))}）`;
}

function renderTimeline() {
  const tl = $('tl');
  const now = new Date();
  const dayStart = parse(S.dayStart), dayEnd = parse(S.dayEnd);
  [...tl.querySelectorAll('.hour,.ev,.nowline,.empty')].forEach(n => n.remove());

  const totalH = (dayEnd - dayStart) / 3600000;
  tl.style.height = (totalH * PXH) + 'px';
  for (let i = 0; i <= totalH; i++) {
    const h = new Date(dayStart.getTime() + i * 3600000);
    const d = document.createElement('div');
    d.className = 'hour' + (i === 0 ? ' first' : '');
    d.style.top = (i * PXH) + 'px';
    d.innerHTML = `<i class="num">${p2(h.getHours())}</i>`;
    tl.appendChild(d);
  }

  // 重叠的块并排摆
  const items = S.events
    .filter(e => parse(e.end) > dayStart && parse(e.start) < dayEnd)
    .map(e => ({ e, s: parse(e.start), en: parse(e.end) }))
    .sort((a,b) => a.s - b.s || b.en - a.en);

  let cluster = [], cEnd = -Infinity;
  const flush = () => {
    if (!cluster.length) return;
    const lanes = [];
    for (const it of cluster) {
      let i = lanes.findIndex(end => end <= it.s);
      if (i === -1) { i = lanes.length; lanes.push(it.en); } else lanes[i] = it.en;
      it.lane = i;
    }
    const n = lanes.length;
    for (const it of cluster) { it.width = 100 / n; it.left = it.lane * (100 / n); }
    cluster = []; cEnd = -Infinity;
  };
  for (const it of items) {
    it.lane = 0; it.width = 100; it.left = 0;
    if (it.s >= cEnd) flush();
    cluster.push(it); cEnd = Math.max(cEnd, it.en);
  }
  flush();

  for (const it of items) {
    const e = it.e;
    const c = catOf(e.cat);
    const top = Math.max(0, (it.s - dayStart) / 3600000 * PXH);
    const h = Math.max(9, (Math.min(it.en, dayEnd) - Math.max(it.s, dayStart)) / 3600000 * PXH);
    const el = document.createElement('div');
    el.className = 'ev'
      + (it.en < now ? ' past' : '')
      + (e.done ? ' done' : '')
      + (isRunning(e.id) ? ' running' : '')
      + (h < 26 ? ' mini' : '');
    el.dataset.id = e.id;
    el.style.top = top + 'px';
    el.style.height = h + 'px';
    el.style.left = `calc(44px + (100% - 44px) * ${it.left/100})`;
    el.style.width = `calc((100% - 44px) * ${it.width/100} - 4px)`;
    el.style.setProperty('--c', c.color);
    el.style.setProperty('--s', c.soft);
    const act = actualOf(e, now);
    el.innerHTML = `<span class="ev-emoji">${c.emoji}</span>
      <div class="ev-n">${esc(e.title)}</div>
      <div class="ev-t num">${hhmm(it.s)}–${hhmm(it.en)}${act >= 1 ? ` · 实${fmtDur(act)}` : ''}</div>
      <div class="rz"></div>`;
    el.title = `${hhmm(it.s)}–${hhmm(it.en)} ${e.title}\n计划 ${fmtDur((it.en - it.s) / 60000)}`
      + (act >= 1 ? ` · 实际 ${fmtDur(act)}` : ' · 还没开始计时')
      + `\n拖动改时间 · 拉底边改时长 · 点一下打开菜单`;
    bindBlock(el, e);
    tl.appendChild(el);
  }

  if (S.isToday && now >= dayStart && now <= dayEnd) {
    const nl = document.createElement('div');
    nl.className = 'nowline';
    nl.style.top = ((now - dayStart) / 3600000 * PXH) + 'px';
    nl.innerHTML = `<i></i><b class="num">${hhmm(now)}</b>`;
    tl.appendChild(nl);
  }

  if (!S.events.length) {
    const box = document.createElement('div');
    box.className = 'empty';
    box.innerHTML = S.isToday ? EMPTY_HTML : EMPTY_HTML.replace('今天', '这天');
    tl.appendChild(box);
  }
}

/* ================= 右侧面板 ================= */
function renderSide() {
  $('n-todo').textContent = S.tasks.filter(t => !t.done).length;
  $('n-tray').textContent = S.tray.length;
  $('n-idea').textContent = S.ideas.length;
  const body = $('side-body');
  const draft = $('idea-input') ? $('idea-input').value : ideaDraft;
  ideaDraft = draft;
  if (pane === 'todo') renderTodo(body);
  else if (pane === 'tray') renderTray(body);
  else renderIdea(body, draft);
}

function renderTodo(box) {
  box.innerHTML = '';
  const open = S.tasks.filter(t => !t.done);
  const done = S.tasks.filter(t => t.done);

  for (const c of CATS) {
    const list = open.filter(t => normC(t.cat) === c.key);
    if (!list.length) continue;
    box.appendChild(groupHead(c, list.length, c.key));
    list.forEach(t => box.appendChild(todoRow(t, c)));
  }
  const rest = open.filter(t => normC(t.cat) === 'other');
  if (rest.length) {
    box.appendChild(groupHead(OTHER, rest.length, 'other'));
    rest.forEach(t => box.appendChild(todoRow(t, OTHER)));
  }

  if (!open.length) {
    const d = document.createElement('div');
    d.className = 'empty-note';
    d.innerHTML = '还没有待办<br><span style="font-size:11px;color:#C8BCAC">点右上角 ＋ 加一条</span>';
    box.appendChild(d);
  }

  if (done.length) {
    const h = document.createElement('div');
    h.className = 'grp-h';
    h.style.marginTop = '14px';
    h.innerHTML = `<span class="gname" style="color:#B3A99C">已完成 ${done.length}</span>`;
    box.appendChild(h);
    done.slice(0, 20).forEach(t => box.appendChild(todoRow(t, catOf(t.cat), true)));
  }
}

function groupHead(c, n, key) {
  const h = document.createElement('div');
  h.className = 'grp';
  h.innerHTML = `<div class="grp-h">
      <span>${c.emoji}</span><span class="gname">${c.name}</span>
      <span class="gcount num">${n}</span>
      <button class="gadd" title="往「${c.name}」加一条">＋</button>
    </div>`;
  h.querySelector('.gadd').onclick = () => openSheet('task', null, key);
  return h;
}

function todoRow(t, c, isDoneSection) {
  const el = document.createElement('div');
  const running = !!(S.timer && S.timer.taskId === t.id);
  el.className = 'row' + (t.done ? ' done' : '') + (running ? ' running' : '');
  el.style.setProperty('--c', c.color);
  el.dataset.id = t.id;
  el.innerHTML = `<span class="grip">⠿</span>
    <span class="bar"></span>
    <span class="txt">${esc(t.title)}</span>
    ${t.todayActual ? `<span class="done-min num">已做${fmtDur(t.todayActual)}</span>` : ''}
    ${t.estMin ? `<span class="est num">${fmtDur(t.estMin)}</span>` : ''}
    ${isDoneSection ? '' : `<button class="sched" title="排到时间轴">📅</button>`}
    ${isDoneSection ? '' : `<button class="play" title="${running ? '正在计时' : '开始计时'}">${running ? '■' : '▶'}</button>`}
    <span class="chk" title="${t.done ? '取消完成' : '完成'}"></span>
    <button class="del" title="删除">✕</button>`;

  const play = el.querySelector('.play');
  if (play) play.onclick = async e => {
    e.stopPropagation();
    await startTimer({ taskId: t.id });
  };

  const sc = el.querySelector('.sched');
  if (sc) sc.onclick = e => {
    e.stopPropagation();
    if (window.MOBILE_SCHEDULE) {
      window.MOBILE_SCHEDULE({ kind: 'task', id: t.id, title: t.title, cat: normC(t.cat), estMin: t.estMin });
    }
  };

  el.querySelector('.chk').onclick = async e => {
    e.stopPropagation();
    await call('/api/task/update', { id: t.id, done: !t.done });
    if (!t.done) burst(e.clientX, e.clientY);
    await load();
    if (!t.done) toast(`「${t.title}」完成 🎉`);
  };
  el.querySelector('.del').onclick = async e => {
    e.stopPropagation();
    await call('/api/task/delete', { id: t.id, title: t.title });
    await load();
    toast('已删掉这条待办');
  };
  el.querySelector('.txt').onclick = () => openSheet('task', t);

  if (!isDoneSection) {
    el.draggable = true;
    el.addEventListener('dragstart', e => {
      dragItem = { kind:'task', id:t.id, title:t.title, cat:normC(t.cat), estMin:t.estMin };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', t.title);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      dragItem = null;
      clearDropMarks();
    });
    el.addEventListener('dragover', e => {
      if (!dragItem || dragItem.kind !== 'task') return;
      if (dragItem.cat !== normC(t.cat) || dragItem.id === t.id) return;
      e.preventDefault();
      clearDropMarks();
      el.classList.add('drop-target');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
    el.addEventListener('drop', async e => {
      e.preventDefault();
      clearDropMarks();
      if (!dragItem || dragItem.kind !== 'task' || dragItem.cat !== normC(t.cat)) return;
      const cat = normC(t.cat);
      const draggedId = dragItem.id;
      const list = S.tasks.filter(x => normC(x.cat) === cat && !x.done).map(x => x.id);
      const from = list.indexOf(draggedId);
      const to = list.indexOf(t.id);
      dragItem = null;
      if (from === -1 || to === -1 || from === to) return;
      list.splice(from, 1);
      list.splice(to, 0, draggedId);
      await call('/api/task/reorder', { cat, ids: list });
      await load();
    });
  }
  return el;
}

const clearDropMarks = () => document.querySelectorAll('.drop-target').forEach(n => n.classList.remove('drop-target'));

function renderTray(box) {
  box.innerHTML = '';
  const chips = document.createElement('div');
  chips.className = 'chips';
  if (!S.tray.length) {
    chips.innerHTML = '<div class="empty-note" style="width:100%">托盘是空的<br>把每天固定要做的事放这儿，拖进时间轴就行</div>';
  }
  for (const t of S.tray) {
    const c = catOf(t.cat);
    const el = document.createElement('div');
    el.className = 'chip' + (t.onToday ? ' on-day' : '');
    el.style.setProperty('--c', c.color);
    el.draggable = true;
    el.innerHTML = `<span class="bar"></span><span class="nm">${esc(t.title)}</span>
      <span class="mm num">${fmtDur(t.minutes)}</span><button class="sched" title="排到时间轴">📅</button><button class="x" title="删掉">✕</button>`;
    el.title = t.onToday ? `${t.title}\n今天已经排过了` : `${t.title}\n拖进时间轴 = 排进今天`;
    el.addEventListener('dragstart', e => {
      dragItem = { kind:'tray', id:t.id, title:t.title, cat:normC(t.cat), minutes:t.minutes };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', t.title);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragItem = null; });
    el.querySelector('.nm').onclick = () => openSheet('tray', t);
    const tsc = el.querySelector('.sched');
    if (tsc) tsc.onclick = e => {
      e.stopPropagation();
      if (window.MOBILE_SCHEDULE) {
        window.MOBILE_SCHEDULE({ kind: 'tray', id: t.id, title: t.title, cat: normC(t.cat), minutes: t.minutes });
      }
    };
    el.querySelector('.x').onclick = async e => {
      e.stopPropagation();
      await call('/api/tray/delete', { id: t.id, title: t.title });
      await load();
      toast('已从托盘移除');
    };
    chips.appendChild(el);
  }
  box.appendChild(chips);

  const add = document.createElement('div');
  add.className = 'addrow';
  add.textContent = '＋ 加一项固定日程';
  add.onclick = () => openSheet('tray');
  box.appendChild(add);
}

function renderIdea(box, draft) {
  box.innerHTML = `
    <div class="idea-in">
      <input id="idea-input" placeholder="想到什么，回车记下来…" maxlength="500">
    </div>
    <div id="idea-list"></div>`;
  const input = $('idea-input');
  input.value = draft || '';
  const list = $('idea-list');
  if (!S.ideas.length) {
    list.innerHTML = '<div class="empty-note">灵感箱还空着<br><span style="font-size:11px;color:#C8BCAC">随手一句话就行，不用想结构</span></div>';

  S.ideas.forEach((it, i) => {
    const c = it.cat ? catOf(it.cat) : null;
