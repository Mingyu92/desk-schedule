	<body>
		<header class="nav-bar" id="main-nav-bar">
			<h1 id="logo"><a href="pomodoro.html">pomodoro</a></h1>

			<ul class="nav-list">
				<li class="nav-item" id="about">
					<button id="about-btn" class="nav-btn">
						<a href="#" id="about-link" class="nav-link">
							about
						</a>
					</button>
				</li>

				<li class="nav-item" id="settings">
					<button id="settings-btn" class="nav-btn">
						<a href="#" id="settings-link" class="nav-link">settings</a>
					</button>
				</li>
			</ul>
		</header>

		<section class="settings-container">
			<div class="body">
				<div class="pomodoro-length options">
					<p class="subtitle">pomodoro timer</p>
					<button class="opt-btn active-pl" id="pl-25">25</button>
					<button class="opt-btn" id="pl-15">15</button>
					<button class="opt-btn" id="pl-10">10</button>
				</div>

				<div class="small-break-length options">
					<p class="subtitle">small break timer</p>
					<button class="opt-btn active-sl" id="sl-5">5</button>
					<button class="opt-btn" id="sl-10">10</button>
					<button class="opt-btn" id="sl-15">15</button>
				</div>

				<div class="long-break-length options">
					<p class="subtitle">long break timer</p>
					<button class="opt-btn active-lb" id="lb-15">15</button>
					<button class="opt-btn" id="lb-20">20</button>
					<button class="opt-btn" id="lb-30">30</button>
				</div>
			</div>
		</section>

		
		
	<script>
// options
const pl25 = document.querySelector("#pl-25")
const pl15 = document.querySelector("#pl-15")
const pl10 = document.querySelector("#pl-10")

const sl5 = document.querySelector("#sl-5")
const sl10 = document.querySelector("#sl-10")
const sl15 = document.querySelector("#sl-15")

const lb15 = document.querySelector("#lb-15")
const lb20 = document.querySelector("#lb-20")
const lb30 = document.querySelector("#lb-30")

sl5.addEventListener("click", () => {
	items = document.querySelectorAll(".active-sl");
	for (const e of items) e.classList.remove("active-sl");
	sl5.classList.add("active-sl");
	if (window.localStorage) {
		localStorage.setItem("sbTime", "5:00");
		localStorage.setItem("sbItem", "#sl-5");
	}
})

sl10.addEventListener("click", () => {
	items = document.querySelectorAll(".active-sl");
	for (const e of items) e.classList.remove("active-sl");
	sl10.classList.add("active-sl");
	if (window.localStorage) {
		localStorage.setItem("sbTime", "10:00");
		localStorage.setItem("sbItem", "#sl-10");
	}
})

sl15.addEventListener("click", () => {
	items = document.querySelectorAll(".active-sl");
	for (const e of items) e.classList.remove("active-sl");
	sl15.classList.add("active-sl");
	if (window.localStorage) {
		localStorage.setItem("sbTime", "15:00");
		localStorage.setItem("sbItem", "#sl-15");
	}
})

pl25.addEventListener("click", () => {
	items = document.querySelectorAll(".active-pl")
	for (const e of items) e.classList.remove("active-pl")
	pl25.classList.add("active-pl")
	if (window.localStorage) {
		localStorage.setItem("plTime", "25:00")
		localStorage.setItem("plItem", "#pl-25")
	}
})


pl15.addEventListener("click", () => {
	let items = document.querySelectorAll(".active-pl")
	for (const e of items) e.classList.remove("active-pl")
	pl15.classList.add("active-pl")
	if (window.localStorage) {
		localStorage.setItem("plTime", "15:00")
		localStorage.setItem("plItem", "#pl-15")
	}
})


pl10.addEventListener("click", () => {
	items = document.querySelectorAll(".active-pl") || null
	for (const e of items) e.classList.remove("active-pl")
	pl10.classList.add("active-pl")
	if (window.localStorage) {
		localStorage.setItem("plTime", "10:00")
		localStorage.setItem("plItem", "#pl-10")
	}
})

lb15.addEventListener("click", () => {
	items = document.querySelectorAll(".active-lb")
	for (const e of items) e.classList.remove("active-lb")
	lb15.classList.add("active-lb")
	if (window.localStorage) {
		localStorage.setItem("lbTime", "15:00")
		localStorage.setItem("lbItem", "#lb-15")
	}
})


lb20.addEventListener("click", () => {
	let items = document.querySelectorAll(".active-lb")
	for (const e of items) e.classList.remove("active-lb")
	lb20.classList.add("active-lb")
	if (window.localStorage) {
		localStorage.setItem("lbTime", "20:00")
		localStorage.setItem("lbItem", "#lb-20")
	}
})

lb30.addEventListener("click", () => {
	items = document.querySelectorAll(".active-lb") || null
	for (const e of items) e.classList.remove("active-lb")
	lb30.classList.add("active-lb")
	if (window.localStorage) {
		localStorage.setItem("lbTime", "30:00")
		localStorage.setItem("lbItem", "#lb-30")
	}
})

</script>
<script>
let timerDisplay = document.querySelector("#display");
let pomodoroTime, timeObj;
let smallBreakTime, smallBreakObj;
let longBreakTime, longBreakObj;

if (window.localStorage && localStorage.plTime && localStorage.plItem) {
	pomodoroTime = localStorage.getItem("plTime");
	timeObj = localStorage.getItem("plItem");
}

if (window.localStorage && localStorage.sbTime && localStorage.sbItem) {
	[smallBreakTime, smallBreakObj] = [
		localStorage.getItem("sbTime"),
		localStorage.getItem("sbItem"),
	];
} else {
	localStorage.setItem("sbTime", "5:00");
	localStorage.setItem("sbItem", "#sb-5");
}

if (window.localStorage && localStorage.lbTime && localStorage.lbItem) {
	[longBreakTime, longBreakObj] = [
		localStorage.getItem("lbTime"),
		localStorage.getItem("lbItem"),
	];
} else {
	localStorage.setItem("lbTime", "15:00");
	localStorage.setItem("lbItem", "#ll-15");
}
if (timerDisplay) {
	if (pomodoroTime) timerDisplay.innerHTML = pomodoroTime;
	else {
		timerDisplay.innerHTML = "25:00";
		if (window.localStorage) localStorage.setItem("plTime", "25:00");
	}
}

if (timeObj) {
	const activeObj = document.querySelector(timeObj);
	if (activeObj) {
		const items = document.querySelectorAll(".active-pl");
		for (const e of items) e.classList.remove("active-pl");
		activeObj.classList.add("active-pl");
	}
}

if (smallBreakObj) {
	const activeObj = document.querySelector(smallBreakObj);
	if (activeObj) {
		const items = document.querySelectorAll(".active-sl");
		for (const e of items) e.classList.remove("active-sl");
		activeObj.classList.add("active-sl");
	}
}

if (longBreakObj) {
	const activeObj = document.querySelector(longBreakObj);
	if (activeObj) {
		const items = document.querySelectorAll(".active-lb");
		for (const e of items) e.classList.remove("active-lb");
		activeObj.classList.add("active-lb");
	}
}

</script>
